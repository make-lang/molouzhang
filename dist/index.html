/* 版面：960×540 的固定横版舞台（1080p 屏幕正好 2 倍整数缩放），按窗口等比缩放并居中。顶部 HUD，左住户栏，中间地图，右情境面板，底部回合栏；所有对话框都在舞台里。 */
/* 刻意只做一种深色：停电后的老街区，琥珀色的灯是唯一的暖色。 */
:root {
  color-scheme: dark;
  --void: #050608;
  --stage: #10131a;
  --panel: #191d27;
  --panel2: #222736;
  --sunk: #0c0e14;
  --edge: #353c4f;
  --edge-hi: #59627a;
  --ink: #ebe4cf;
  --dim: #8b91a3;
  --amber: #f0b04a;
  --amber-dk: #9c6420;
  --red: #e2654b;
  --good: #86c79c;
  --zombie: #a9c843;
  --kin: #ea92b2;
  --font: "FusionPixel", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--void); color: var(--ink); margin: 0; overflow: hidden;
  font: 12px/18px var(--font); -webkit-font-smoothing: none;
}
#fit {
  position: fixed; inset: 0; display: grid; place-items: center; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-bottom, 0px));
}
#scaler { position: relative; }
#stage {
  position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0;
  background: var(--stage); overflow: hidden; box-shadow: 0 0 0 2px var(--edge);
}
#stage * { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:focus-visible, canvas:focus-visible, textarea:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
img.ic { width: 16px; height: 16px; image-rendering: pixelated; display: inline-block; vertical-align: -4px; }

.frame {
  background: linear-gradient(180deg, #1c2130 0, var(--panel) 40px); border: 2px solid var(--edge);
  box-shadow: inset 0 0 0 1px var(--sunk), inset 0 2px 0 1px #262c3c;
  clip-path: polygon(2px 0, calc(100% - 2px) 0, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 0 calc(100% - 2px), 0 2px);
}
.btn {
  background: var(--panel2); border: 2px solid var(--edge); padding: 2px 8px; line-height: 16px; box-shadow: inset 0 -2px 0 var(--sunk), inset 0 1px 0 #333a4e;
  clip-path: polygon(2px 0, calc(100% - 2px) 0, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 0 calc(100% - 2px), 0 2px);
}
.btn:hover:not(:disabled) { border-color: var(--amber); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: var(--amber); color: #1b1206; border-color: #ffd58a; box-shadow: inset 0 -2px 0 var(--amber-dk); }
.btn.primary:hover:not(:disabled) { border-color: #fff1d0; }
.dim { color: var(--dim); }
.c-red { color: var(--red); } .c-amber { color: var(--amber); } .c-good { color: var(--good); } .c-kin { color: var(--kin); } .c-z { color: var(--zombie); }
.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
.scroll::-webkit-scrollbar { width: 4px; } .scroll::-webkit-scrollbar-thumb { background: var(--edge); }

/* HUD */
#hud { position: absolute; left: 0; top: 0; width: 960px; height: 32px; display: flex; align-items: center; gap: 14px; padding: 0 6px 0 10px;
  background: linear-gradient(180deg, #151925, var(--sunk)); border-bottom: 2px solid var(--edge); box-shadow: 0 2px 0 #07080c; }
#hud .logo { color: var(--amber); }
#hud img.ic { width: 16px; height: 16px; }
#hud .res { display: flex; align-items: center; gap: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#hud .res small { font-size: 12px; color: var(--dim); }
#hud .spacer { flex: 1; }
.hp { width: 48px; height: 8px; background: var(--panel); border: 1px solid var(--edge-hi); position: relative; }
.hp i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); }
.hp.low i { background: var(--red); }
#hud > * { white-space: nowrap; flex-shrink: 0; }
#hud .spacer { flex-shrink: 1; min-width: 0; }
#hud .menu { display: flex; gap: 4px; }
#hud .menu .btn { padding: 1px 8px; line-height: 16px; border-width: 1px; }

/* 住户栏 */
#roster { position: absolute; left: 8px; top: 40px; width: 224px; height: 432px; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.ptitle { display: flex; justify-content: space-between; color: var(--dim); padding: 0 2px; }
#people { flex: 1; display: flex; flex-direction: column; gap: 4px; padding-right: 3px; }
.pc { display: grid; grid-template-columns: 36px 1fr; gap: 0 7px; text-align: left; padding: 5px 6px; border: 1px solid transparent; background: var(--panel2); position: relative; box-shadow: inset 0 1px 0 #2c3245, inset 0 -1px 0 #161a24; }
.pc canvas { box-shadow: 0 0 0 1px #0c0e14, 0 0 0 2px #3a4258; }
.pc:hover { border-color: var(--edge-hi); }
.pc.sel { border-color: var(--amber); background: #2d2a26; }
.pc.out { opacity: .55; }
.pc canvas { width: 36px; height: 36px; image-rendering: pixelated; grid-row: 1 / span 2; }
.pc .nm { display: flex; gap: 6px; padding-right: 20px; align-items: baseline; white-space: nowrap; overflow: hidden; }
.pc .nm span { color: var(--dim); }
.pc .nm .trait { color: #d6b98a; }
.pc .sk { padding-right: 16px; display: flex; gap: 2px; align-items: center; color: var(--dim); white-space: nowrap; }
.pc .sk em { font-style: normal; color: var(--ink); margin-right: 5px; }
.pc .job { color: var(--dim); margin-left: 2px; overflow: hidden; text-overflow: ellipsis; }
.pc .tk { grid-column: 1 / -1; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
.pc .tk.hurt { color: var(--red); }
.pc .kin { position: absolute; right: 6px; top: 6px; }
.pc .gear { position: absolute; right: 6px; top: 26px; }
.pc .kin img.ic, .pc .gear img.ic { width: 16px; height: 16px; }
.gi { display: flex; flex-direction: column; gap: 2px; padding: 5px 7px; background: var(--panel2); }
.gi .row2 { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.gi .row2 button { white-space: nowrap; }
.gh { color: var(--amber); margin-top: 2px; }

/* 地图 */
#mapwrap { position: absolute; left: 240px; top: 40px; width: 384px; height: 432px; }
#map { position: absolute; left: 0; top: 0; width: 384px; height: 384px; image-rendering: pixelated; cursor: pointer; background: #0b0d12; box-shadow: 0 0 0 2px var(--sunk), 0 0 0 4px var(--edge), 0 0 0 5px #0a0b10; }
#mapcap { position: absolute; left: 0; top: 392px; width: 384px; height: 40px; display: flex; flex-direction: column; justify-content: center; color: var(--dim); white-space: nowrap; overflow: hidden; }
#mapcap > span { overflow: hidden; text-overflow: ellipsis; }
#mapcap.hasmini { padding-right: 46px; }
#mini { position: absolute; right: 0; top: 394px; width: 36px; height: 36px; image-rendering: pixelated; cursor: pointer; box-shadow: 0 0 0 1px var(--edge-hi); }
#map.pan { touch-action: none; }
#tip { position: absolute; pointer-events: none; padding: 0 4px; background: var(--sunk); border: 1px solid var(--edge-hi); white-space: nowrap; z-index: 3; }

/* 右侧面板 */
#side { position: absolute; left: 632px; top: 40px; width: 320px; height: 432px; display: flex; flex-direction: column; }
#tabs { display: flex; border-bottom: 2px solid var(--edge); }
#tabs button { flex: 1; padding: 4px 0; text-align: center; color: var(--dim); background: var(--sunk); border-right: 1px solid var(--edge); }
#tabs button:last-child { border-right: 0; }
#tabs button[aria-selected="true"] { color: var(--ink); background: var(--panel); box-shadow: inset 0 2px 0 var(--amber); }
#sidebody { flex: 1; padding: 8px 8px 8px 10px; display: flex; flex-direction: column; gap: 7px; }
.th { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.th b { font-weight: 400; color: var(--amber); }
.chip { padding: 0 3px; border: 1px solid currentColor; line-height: 12px; }
.desc { color: var(--dim); }
.kv { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.box { background: var(--sunk); padding: 5px 8px; border-left: 2px solid var(--edge); }
.box.fail { border-color: var(--red); } .box.risk { border-color: var(--amber); } .box.safe { border-color: var(--good); } .box.kin { border-color: var(--kin); }
.acts { display: flex; flex-direction: column; gap: 4px; }
.act { display: grid; grid-template-columns: 1fr auto; text-align: left; padding: 3px 8px 4px; }
.act small { grid-column: 1 / -1; font-size: 12px; color: var(--dim); }
.here button { color: var(--amber); text-decoration: underline; text-underline-offset: 2px; }
.bar2 { display: block; height: 8px; background: var(--panel); position: relative; border: 1px solid var(--edge); }
.bar2 .d { position: absolute; left: 0; top: 0; bottom: 0; background: #f0b04a55; border-right: 1px solid var(--amber); }
.bar2 .t { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, #e2654b99 0 1px, transparent 1px 3px); border-left: 1px solid var(--red); border-right: 1px solid var(--red); }
.fr { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; text-align: left; padding: 5px 8px; background: var(--panel2); border: 1px solid transparent; }
.fr:hover { border-color: var(--edge-hi); }
.fr .bar2 { grid-column: 1 / -1; }
.log p { margin: 0 0 4px; }
.log h4 { margin: 6px 0 3px; font-weight: 400; color: var(--amber); }
.log .good { color: var(--good); } .log .bad { color: var(--red); }

/* 底栏 */
#bar { position: absolute; left: 8px; top: 482px; width: 944px; height: 48px; display: flex; align-items: center; gap: 14px; padding: 0 8px 0 12px; }
#bar img.ic { width: 16px; height: 16px; }
#bar .night { white-space: nowrap; display: flex; gap: 4px; align-items: center; }
#bar .ticker { flex: 1; min-width: 0; text-align: left; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bar .ticker:hover { color: var(--ink); }
#end { padding: 6px 20px; }

/* 对话框 */
#ov { position: absolute; inset: 0; background: #05060ad8; display: grid; place-items: center; z-index: 10; }
#dlg { width: 580px; max-height: 500px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; border-color: var(--amber-dk); }
#dlg h2 { margin: 0; font-weight: 400; font-size: 24px; line-height: 26px; color: var(--amber); display: flex; gap: 8px; align-items: center; }
#dlg h2 img.ic { width: 16px; height: 16px; }
#dlg p { margin: 0; }
#dlg .lines { display: flex; flex-direction: column; gap: 4px; max-height: 320px; padding-right: 4px; }
#dlg .lines .good { color: var(--good); } #dlg .lines .bad { color: var(--red); }
#dlg .choices { display: flex; flex-direction: column; gap: 6px; }
#dlg .choices .btn { padding: 5px 10px; }
#dlg .choices .btn { text-align: left; }
#dlg .choices small { color: var(--dim); margin-left: 6px; font-size: 12px; }
#dlg .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#dlg textarea { width: 100%; height: 80px; background: var(--sunk); color: var(--ink); border: 1px solid var(--edge); font: 10px/12px ui-monospace, Menlo, monospace; padding: 4px; resize: none; }
#dlg input[type=file] { font: inherit; color: var(--dim); max-width: 190px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cards.two { grid-template-columns: repeat(2, 1fr); } .cards.two .card { min-height: 0; }
.cards.four { grid-template-columns: repeat(4, 1fr); } .cards.four .card { min-height: 0; padding: 8px; gap: 4px; }
.box.wx { display: flex; flex-direction: column; gap: 4px; border-color: #74a6dc; margin-bottom: 6px; }
.wxl { display: flex; gap: 6px; align-items: flex-start; } .wxl img.ic { flex-shrink: 0; margin-top: 1px; }
.edges { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; } .btn.edge { padding: 2px 6px; } .btn.edge.sel { border-color: #f0b04a; }
.say { display: flex; gap: 6px; align-items: flex-start; text-align: left; width: 100%; padding: 3px 5px; border: 1px solid transparent; background: none; color: inherit; font: inherit; cursor: pointer; }
.say img.ic { flex-shrink: 0; margin-top: 1px; } .say:hover:not(:disabled) { border-color: var(--edge-hi); } .say.sel { border-color: #74a6dc; } .say:disabled { cursor: default; opacity: .75; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 10px; min-height: 150px; text-align: left; }
.card .ln { align-self: flex-start; padding: 0 3px; border: 1px solid currentColor; line-height: 12px; }
.card b { font-weight: 400; color: var(--amber); }
.card span.d { color: var(--ink); }
.ln-堡垒 { color: #74a6dc; } .ln-拆迁 { color: #c88a3e; } .ln-大家庭 { color: var(--kin); } .ln-远征 { color: var(--good); } .ln-通用 { color: var(--dim); } .ln-城况 { color: #e2654b; } .ln-季节 { color: #74a6dc; } .ln-开局温和 { color: var(--good); } .ln-开局一般 { color: #74a6dc; } .ln-开局较难 { color: var(--amber); } .ln-开局最难 { color: var(--red); } .ln-出身 { color: #d6b98a; }
.rules { display: flex; flex-direction: column; gap: 4px; }
#dlg ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.big { font-size: 24px; line-height: 26px; color: var(--amber); }
#fade { position: absolute; inset: 0; background: #02030a; opacity: 0; pointer-events: none; z-index: 9; }
#fade.go { animation: night 1s ease-in-out; }
@keyframes night { 0% { opacity: 0 } 45% { opacity: .9 } 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { #fade.go { animation: none; } }

#rotate { position: fixed; inset: 0; z-index: 50; background: var(--void); display: grid; place-items: center; text-align: center; box-sizing: border-box;

  const BRANCHES = ['农耕', '营造', '医护', '武备', '侦察'];
  const BOOKS = { 农耕: ['《阳台种菜一本通》', '《农民历》', '《堆肥与土壤》'], 营造: ['《水电维修手册》', '《木工入门》', '《焊接图解》'], 医护: ['《急救手册》', '《家庭医学百科》', '《护理学讲义》'],
    武备: ['《射箭入门》', '《防身术图解》', '《野外求生》'], 侦察: ['《登山地图》', '《气象常识》', '《童军手册》'] };
  const JOB_BR = { 护理师: '医护', 装潢师傅: '营造', 水电工: '营造', 菜贩: '农耕', 里长: '农耕', 退休警察: '武备', 保全: '武备', 健身教练: '武备', 外送员: '侦察' };   // 投奔来的人懂的那一行
  const tech = (s, k) => !!(s.tech && s.tech.done[k]);
  const techOpen = (s, k) => { const T = TECHS[k]; return !tech(s, k) && (!T.pre || tech(s, T.pre)) && (!T.site || s.tiles.some(t => t.owned && t.t === T.site)); };
  const haveNeed = (s, k) => { const n = TECHS[k].need; return !n || n.find(i => (s.items[i] || 0) > 0) || null; };
  const studyPts = v => 1 + (['大学生', '国中老师'].includes(v.job) ? 1 : 0);
  const RACK_MAX = 6;
  // 发电机开着、今天烧得起（或者今天已经烧过）：电网、探照灯、水耕架不用化学品，研究快一半，据点更招尸群
  const powered = s => !!s.gen && tech(s, 'generator') && (s.genDay === s.day || (s.chem || 0) >= 1);
  const fortMax = s => FORT_MAX + (tech(s, 'bunker') ? 4 : 0);
  const lifeOf = (s, k) => FOODS[k].life && k !== 'pickle' && tech(s, 'cellar') ? Math.round(FOODS[k].life * 1.5) : FOODS[k].life;
  const irrK = (s, se) => tech(s, 'irrigate') && (se === 'summer' || se === 'autumn') ? 1.3 : 1;
  const hasNear = (s, x, y, r) => s.tiles.some((t, i) => t.owned && Math.abs(i % s.W - x) + Math.abs(Math.floor(i / s.W) - y) <= r);

  // 学会一项科技：有的马上生效（加厚铁门），其余在用到的地方用 tech(s, k) 判断
  function learn(s, k, why) {
    s.tech.done[k] = true; s.tech.prog[k] = TECHS[k].pts;
    if (s.tech.cur === k) s.tech.cur = null;
    if (k === 'gate') { s.wallMax += 6; s.wall = s.wallMax; }
    s.log.push({ d: s.day, tone: 'good', msg: `${why || ''}学会了「${TECHS[k].name}」：${TECHS[k].desc}` });
    if (k === 'track') {
      const left = nests(s).filter(([x, y]) => !tile(s, x, y).nest.found);
      for (const [x, y] of left) { tile(s, x, y).nest.found = true; tile(s, x, y).seen = true; }
      s.log.push({ d: s.day, tone: left.length ? 'bad' : 'info', msg: left.length ? `顺着脚印和抓痕，在地图上标出了 ${left.length} 个之前没找到的尸巢。` : '顺着脚印找了一圈，没有别的尸巢了。' });
    }
  }
  // 进度攒满、前置和地点都齐了，就用掉一样关键物品学会；缺东西就先搁着，等捡到了再说
  function tryFinish(s) {
    for (const k of Object.keys(TECHS)) {
      if (tech(s, k) || (s.tech.prog[k] || 0) < TECHS[k].pts || !techOpen(s, k)) continue;
      const it = haveNeed(s, k);
      if (!it) continue;
      if (it !== true) s.items[it]--;
      learn(s, k, it !== true ? `用掉一份${ITEMS[it].name}，` : '');
    }
  }
  function addProg(s, k, n) { if (!tech(s, k)) s.tech.prog[k] = Math.min(TECHS[k].pts, (s.tech.prog[k] || 0) + n); }
  // 开关发电机
  function setGen(s0, on) {
    if (!tech(s0, 'generator')) return s0;
    const s = clone(s0); s.gen = !!on; return s;
  }
  // 选现在研究哪一项（k 为空就不研究）
  function setResearch(s0, k) {
    if (k && (!TECHS[k] || !techOpen(s0, k))) return s0;
    const s = clone(s0); s.tech.cur = k || null; return s;
  }
  // 把书和关键物品摆进地图（开局、旧存档迁移时）。free：只摆在还没收复的楼里。最后保证每项要物品的科技，地图上至少有一样能用的
  function stockMap(s, free, only) {
    const ok = t => !isBase(t) && (!free || !t.owned);
    const book = (t, br) => { const ks = Object.keys(TECHS).filter(k => !br || TECHS[k].br === br), k = pick(s, ks); t.books.push({ k, n: rand(s) < 0.12 ? 0 : ri(s, 4, 8), title: pick(s, BOOKS[TECHS[k].br]) }); };
    for (const t of s.tiles) {
      t.items = t.items || []; t.books = t.books || [];
      if (!ok(t)) continue;
      for (const [k, I] of Object.entries(ITEMS)) if (I.src[t.t] && t.items.length < 2 && (!only || only.includes(k)) && rand(s) < I.src[t.t]) t.items.push(k);
      if (t.t === 'police') book(t, '武备');
      else if (t.t === 'gas' || t.t === 'radio') book(t, '侦察');
      if (only) continue;   // 旧存档迁移：只补新加的物品和新两支的书
      if (t.t === 'school') { book(t); book(t); }
      else if (t.t === 'temple') book(t, '农耕');
      else if (t.t === 'hospital') book(t, '医护');
      else if (t.t === 'hardware' || t.t === 'garage') book(t, '营造');
      else if (t.t === 'house' && rand(s) < 0.1) book(t);
    }
    for (const T of Object.values(TECHS)) {
      if (!T.need || s.tiles.some(t => ok(t) && t.items.some(i => T.need.includes(i)))) continue;
      const k = T.need[0], cand = coords(s).filter(([x, y]) => { const t = tile(s, x, y); return ok(t) && ITEMS[k].src[t.t] && distB(s, x, y) >= 2; });
      const any = cand.length ? cand : coords(s).filter(([x, y]) => ok(tile(s, x, y)) && distB(s, x, y) >= 2);
      if (any.length) tile(s, ...pick(s, any)).items.push(k);
    }
