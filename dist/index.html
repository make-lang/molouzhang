      } else if (t.bar >= diff * (s.brute ? 2 : 1)) {
        const loss = diff * (s.brute ? 2 : 1);
        t.bar -= loss;
        L(`${tname(t)}遭到 ${str} 级的冲击，防御 ${def}。路障被冲垮了 ${loss} 层，但人守住了。`, 'bad');
      } else {
        lostTiles.push([f.x, f.y]);
        L(`${tname(t)}遭到 ${str} 级的冲击，防御只有 ${def}。守不住了，大家退回据点。`, 'bad');
        for (const v of guards) if (rand(s) < 0.5) injure(v, 3, t);
        t.owned = false; t.prog = 0; t.bar = 0; t.z = clamp(1 + Math.floor(diff / 2), 1, 5);
        s.stats.tilesLost++;
      }
    }
    if (trapped) L(`${trapped} 处的钉板陷阱绊倒了一批丧尸，要重新布置。`);
    // 开火的人：箭天亮捡回一半；子弹打掉就没了，枪声把附近的丧尸引过来
    let arrows = 0, bullets = 0, noise = 0;
    for (const [id] of shooters(s)) {
      const v = byId(s, id), G = GEAR[v.gear];
      if (G.shot === 'arrow') arrows += G.per; else { bullets += G.per; noise += G.loud; }
      if (G.loud) {
        const [gx, gy] = v.task.x == null ? s.base : [v.task.x, v.task.y];
        for (let i = 0; i < G.loud; i++) {
          const cand = coords(s).filter(([a, b]) => { const u = tile(s, a, b); return !u.owned && !u.camp && u.z < 9 && Math.abs(a - gx) + Math.abs(b - gy) <= 2; });
          if (cand.length) { const [a, b] = pick(s, cand); tile(s, a, b).z++; }
        }
      }
    }
    if (arrows) { const back = Math.floor(arrows * (tech(s, 'fletch') ? 0.75 : 0.5)); s.arrow -= arrows - back; L(`夜里放了 ${arrows} 支箭，天亮捡回 ${back} 支。`); }
    if (bullets) { s.ammo -= bullets; L(`夜里打了 ${bullets} 发子弹。枪声传得很远，附近的丧尸又多了一些。`, 'bad'); }
    // 探照灯：雾夜每盏烧 1 化学品
    const lamps = plan.fronts.filter(f => f.lit).length;
    if (lamps && !powered(s)) s.chem = Math.max(0, s.chem - lamps);
    if (plan.surge && s.wall > 0) everyone(s, 'surge', 5, 0.3);
    if (plan.fronts.length && held === plan.fronts.length) L(`夜里 ${held} 处边界都遭到冲击，全部守住了。`, 'good');
    else if (held) L(`另外 ${held} 处边界守住了。`);
    // 台风：路障被吹垮一层，街上的丧尸被吹散一些
    if (wx === 'typhoon') {
      let n = 0;
      for (const t of owned(s)) if (!isBase(t) && t.bar > 0) { t.bar--; n++; }
      for (const t of s.tiles) if (!t.owned && !t.camp && !t.nest && t.z > 0 && rand(s) < 0.3) t.z--;
      L(`台风刮了一整夜，${n ? `${n} 处路障被吹垮了一层，` : ''}街上的丧尸也被吹散了一些。`, n ? 'bad' : 'info');
      s.flood = s.day + 2;   // 台风天过完，第二天淹水
    }
    // 雷雨夜：雷可能打中街上哪一栋，烧掉丧尸和存货；打中自己的楼就烧掉一点材料
    if (wx === 'thunder' && rand(s) < 0.3) {
      const cand = coords(s).filter(([x, y]) => !isBase(tile(s, x, y)) && !tile(s, x, y).camp);
      if (cand.length) {
        const [x, y] = pick(s, cand), t = tile(s, x, y), nm = `${TYPES[t.t].name}（${x + 1},${y + 1}）`;
        if (t.owned) { const n = Math.min(s.mat, 2); s.mat -= n; L(`雷打中了${tname(t)}，屋顶烧了一角${n ? `，烧掉 ${n} 份木料` : ''}。`, 'bad'); }
        else { t.z = t.nest ? t.z : 0; t.food = Math.floor(t.food / 2); t.mat = Math.floor(t.mat / 2); t.seen = true; L(`一道雷劈在${nm}，烧了半夜。${t.nest ? '巢没烧掉，' : '那里的丧尸烧光了，'}存货也烧掉一半。`, 'info'); }
      }
    }
    // 寒流：每 2 人烧 1 份木料取暖，不够就有人冻病
    if (wx === 'cold' && s.surv.length) {
      const need = Math.ceil(s.surv.length / 2);
      if (s.mat >= need) { s.mat -= need; L(`烧掉 ${need} 份木料取暖。`); }
      else {
        s.mat = 0;
        const v = pick(s, s.surv.filter(u => u.inj === 0).length ? s.surv.filter(u => u.inj === 0) : s.surv);
        v.inj = Math.max(v.inj, 2);
        L(`木料不够烧，楼里冷得像冰窖，${v.name}冻病了，要躺一天。`, 'bad');
      }
    }

    // 断联：和据点不连通的地块守不住
    if (lostTiles.length) {
      const seen = new Set(), q = [];
      for (const [x, y] of coords(s)) if (isBase(tile(s, x, y))) { q.push([x, y]); seen.add(y * s.W + x); }
      while (q.length) {
        const [x, y] = q.shift();
        for (const [a, b] of nbrs(s, x, y)) if (tile(s, a, b).owned && !seen.has(b * s.W + a)) { seen.add(b * s.W + a); q.push([a, b]); }
      }
      for (const [x, y] of coords(s)) {
        const t = tile(s, x, y);
        if (t.owned && !seen.has(y * s.W + x)) {
          t.owned = false; t.prog = 0; t.bar = 0; t.z = 1; s.stats.tilesLost++;
          L(`${tname(t)}和据点之间的路被切断，只能放弃。`, 'bad');
        }
      }
    }
    // 派往已经丢掉的地块的人回据点
    for (const v of s.surv) if ((v.task.k === 'defend' || v.task.k === 'fortify') && v.task.x != null && !tile(s, v.task.x, v.task.y).owned) v.task = { k: 'defend' };

    // 伤员恢复
    const medicHome = s.surv.some(v => tr(v, 'medic') && ready(v) && v.task.k === 'defend' && v.task.x == null);
    const heal = (hasHospital(s) ? 2 : 1) + (has(s, 'triage') ? 1 : 0) + (medicHome ? 1 : 0) + (tech(s, 'stretcher') ? 1 : 0);
    for (const v of s.surv) {
      if (v.inj > 0) { v.inj = Math.max(0, v.inj - heal); if (v.inj === 0) v.task = { k: 'defend' }; }
      if (v.sulk > 0) v.sulk--;
    }
    // 感染（v.inf 是还剩几晚，-1 表示今天早上就要尸变）：医院治好；懂护理的人在家（不是被咬的本人）就拖一晚；否则倒数，到 0 第二天早上要做决定
    for (const v of s.surv.filter(v => v.inf > 0)) {
      if (hasHospital(s)) { v.inf = 0; L(`${v.name}在医院打了针，伤口不再发黑。咬伤治好了。`, 'good'); continue; }
      if (tech(s, 'cure') && (s.chem || 0) >= 1) { s.chem--; v.inf = 0; L(`用掉 1 份化学品配的药，${v.name}的咬伤消了下去。`, 'good'); continue; }
      if (!v.infHeld && s.surv.some(u => u.id !== v.id && tr(u, 'medic') && ready(u) && u.task.k === 'defend' && u.task.x == null)) { v.infHeld = true; L(`${s.surv.find(u => u.id !== v.id && tr(u, 'medic')).name}守着${v.name}清了一夜伤口，感染没有恶化，但只能拖这一晚。`); continue; }
      v.inf--;
      if (v.inf === 0) { v.inf = -1; s.queue.push({ day: s.day + 1, id: 'turn', p: { id: v.id } }); }   // -1：今天早上就要尸变
      else L(`${v.name}的咬伤在发黑，还剩 ${v.inf} 晚。`, 'bad');
    }

    // 牵挂到期
    for (const v of [...s.surv]) {
      const w = v.want;
      if (!w || s.day < w.until) continue;
      const nm = TYPES[tile(s, w.x, w.y).t].name;
      if (w.k === 'protect') { fulfil(s, v, `${nm}一直没被动过。${v.name}嘴上不说，心里很感激。`); continue; }
      v.want = null;
      if (w.k === 'rescue') {
        if (v.gear) s.stash.push(v.gear);
        s.surv = s.surv.filter(u => u.id !== v.id); s.gone.push(v.name); s.stats.lost++;
        grief(s, v, 'died', -20, 0.4, -5, 0.2);
        L(`${v.name}等不下去了，半夜一个人去${nm}找${w.kin}，再也没有回来。`, 'bad');
      } else {
        v.sulk = 2; remember(s, v, 'wantLost', w.pledged ? -16 : -10, 0.25);
        L(`${v.name}一直没等到人去${w.k === 'fetch' ? `拿${w.item}` : `收回${nm}`}，整个人消沉了好几天。`, 'bad');
      }
    }
    // 求救信号到期
    if (s.sos && s.day >= s.sos.until) {
      const nm = TYPES[tile(s, s.sos.x, s.sos.y).t].name;
      if (s.sos.promised) {
        for (const v of s.surv.filter(v => v.sulk === 0).slice(0, 2)) v.sulk = 1;
        everyone(s, 'sosBroken', -5, 0.25);
        L(`收音机里再也没有${nm}的声音了。答应过要去的，大家心里都不好受。`, 'bad');
      } else L(`收音机里再也没有${nm}的声音了。`);
      s.sos = null;
    }
    // 偶尔有人生出新的牵挂
    if (s.surv.filter(v => v.want).length < 2 && rand(s) < 0.12) {
      const cand = s.surv.filter(v => !v.want);
      if (cand.length) { const v = pick(s, cand), w = makeWant(s, v); if (w) L(`${v.name}找你谈了一次：${w.txt}。`, 'info'); }
    }

    // 人心：崩溃的人夜里可能走掉（一晚最多一个）；有人换了档就提一句
    { const v = s.surv.find(v => moodLv(s, v) === 0 && rand(s) < 0.15);
      if (v) {
        const m = worstMem(s, v);
        if (v.gear) s.stash.push(v.gear);
        s.surv = s.surv.filter(u => u.id !== v.id); s.gone.push(v.name); s.stats.lost++; s.stats.broke = (s.stats.broke || 0) + 1;
        L(`${v.name}${m ? memTxt(m) : '撑不下去了'}，半夜收拾东西走了，铁门没关好。`, 'bad');
        grief(s, v, 'left', -8, 0.3, 0, 0);
      } }
    for (const v of s.surv) {
      const lv = moodLv(s, v), was = v.ml == null ? 2 : v.ml;
      v.ml = lv;
      if (lv === was) continue;
      const bad = worstMem(s, v), good = worstMem(s, v, true), why = bad ? memTxt(bad) : (moodNow(s, v).filter(x => x[1] < 0)[0] || ['日子太难'])[0];
      if (lv === 0) L(`${v.name}一整天没开口。${why}，人像被抽空了。再这样下去，怕是留不住。`, 'bad');
      else if (lv === 1 && was > 1) L(`${v.name}最近闷闷不乐：${why}。干活提不起劲。`, 'bad');
      else if (lv === 3) L(`${v.name}一早就在顶楼哼歌${good ? `，说${memTxt(good)}` : ''}，干活特别卖力。`, 'good');
      else if (lv === 2 && was < 2) L(`${v.name}的脸色好了一些。`, 'good');
    }

    // 丧尸扩散：只在尸巢附近（和尖叫者旁边）发生。密集区会往外溢，空出来的地块会被重新占据
    const before = s.tiles.map(t => t.z);
    if (wx !== 'typhoon' && wx !== 'cold') for (const [x, y] of coords(s)) {   // 台风、寒流的夜里不繁殖
      const t = tile(s, x, y);
      if (t.owned || t.camp || t.nest) continue;
      const nz = nbrs(s, x, y).map(([a, b2]) => before[b2 * s.W + a]);
      const loud = t.scream || nbrs(s, x, y).some(([a, b2]) => tile(s, a, b2).scream);
      if (!loud && !nearNest(s, x, y)) continue;
      if (t.z > 0 && t.z < 9 && (loud || nz.some(z => z >= 3)) && rand(s) < (t.scream ? 0.35 : loud ? 0.22 : 0.12)) t.z++;
      else if (t.z === 0 && (loud || nz.some(z => z >= 2)) && rand(s) < (loud ? 0.2 : 0.08)) t.z = 1;
    }

    // 休眠的巢到时候醒过来
    for (const [x, y] of nests(s)) {
      const t = tile(s, x, y);
      if (!t.nest.sleep || s.day < t.nest.sleep) continue;
      Object.assign(t.nest, { sleep: 0, born: s.day, lv: 1, hp: nestHp(1) }); t.z = Math.max(t.z, nestZ(1));
      L(t.nest.found ? `${TYPES[t.t].name}（${x + 1},${y + 1}）那个没动静的尸巢醒了。` : '半夜，街区深处的丧尸突然聚成一团。有个尸巢醒了，不知道在哪。', 'bad');
    }
    // 尸巢：到时候长大一级，巢本身回 1 点，自己这格补丧尸，再往两格以内喷（尸潮夜喷双倍）
    for (const [x, y] of awake(s)) {
      const t = tile(s, x, y), lv = nestLv(t.nest, s.day);
      if (lv > t.nest.lv) { t.nest.lv = lv; t.nest.hp += 2; L(t.nest.found ? `${TYPES[t.t].name}（${x + 1},${y + 1}）的尸巢又大了一圈。` : '夜里不知道哪个方向传来一阵湿漉漉的蠕动声，有个没找到的尸巢又长大了。', 'bad'); }
      t.nest.hp = Math.min(nestHp(t.nest.lv), t.nest.hp + 1);
      t.z = Math.min(nestZ(t.nest.lv), t.z + t.nest.lv);
      const cand = coords(s).filter(([a, b]) => { const u = tile(s, a, b), d = Math.abs(a - x) + Math.abs(b - y); return d >= 1 && d <= 2 && !u.owned && !u.camp && !u.nest && u.z < 9; });
      for (let i = 0, n = t.nest.lv * (plan.surge ? 2 : 1); i < n && cand.length; i++) { const [a, b] = pick(s, cand); tile(s, a, b).z++; }
    }


    // 偶尔冒出新的尖叫者（最多三只，满街尖叫最多五只；大雨、雷雨夜不会冒出来）
    const screamCap = MUTE.includes(wx) ? 0 : s.city === 'screams' ? 5 : 3;
    if (coords(s).filter(([x, y]) => tile(s, x, y).scream).length < screamCap && rand(s) < (s.city === 'screams' ? 0.1 : 0.05)) {
      const all = coords(s).filter(([x, y]) => { const t = tile(s, x, y); return !t.owned && !t.scream && !t.camp && !t.nest && t.z >= 3; });
      const near = all.filter(([x, y]) => nearNest(s, x, y, 1)), cand = near.length ? near : all;   // 多半是从尸巢里爬出来的
      if (cand.length) { const [x, y] = pick(s, cand), t = tile(s, x, y); t.scream = true; t.seen = true; L(`${TYPES[t.t].name}（${x + 1},${y + 1}）那边传来尖叫声。又一只尖叫者。`, 'bad'); }
    }

    // 结局判定
    if (s.wall <= 0) s.over = { win: false, reason: '铁门在凌晨被撞开了。' };
    else if (!s.surv.length) s.over = { win: false, reason: '最后一个人也离开了这栋楼。' };
    else if (!nests(s).length) s.over = { win: true, ending: 'safe', reason: '最后一个尸巢烧完之后，街上再也没有冒出新的丧尸。剩下的游荡者一只只被清掉，这条街安静了。你们可以在这里住下去了。' };
    s.day++;
    // 救援：电台接通、有降落点，就约好 4 天后来；到时候降落点或电台丢了，直升机只能掉头
    if (!s.over && s.radio && !s.rescueDay && radioUp(s) && (s.radio === 'old' || landing(s))) {
      s.rescueDay = s.day + 4;
      L(`电台那头确认了降落点，直升机第 ${s.rescueDay} 天早上到。守住电台和空地。`, 'good');
    }
    if (!s.over && s.rescueDay && s.day >= s.rescueDay) {
      if (radioUp(s) && (s.radio === 'old' || landing(s))) s.over = { win: true, ending: 'rescue', reason: '直升机的声音从电台方向传来，螺旋桨把空地上的落叶全卷了起来。你们得救了。' };
      else { s.rescueDay = null; L('直升机在头顶绕了两圈，找不到能降落的地方，飞走了。等守住电台和空地，再联络一次。', 'bad'); }
    }
    // 换季
    if (!s.over && s.start) {
      const prev = s.season;
      s.season = seasonOf(s);
      if (s.season !== prev) {
        L(`入${SEASONS[s.season].name}了。${SEASONS[s.season].desc}`, 'info');
        if (prev === 'winter' && s.winterIn && selfFed(s)) s.over = { win: true, ending: 'self', reason: '冬天过去了。菜园冒出新芽，楼里的人比停电时还多。不用等谁来救，这里已经是一个村子了。' };
        if (s.season === 'winter') {
          s.winterIn = true;
          // 线索：熬过冬天、自给自足也是出路
          if (!s.winterHint && s.surv.length) { s.winterHint = true; const o = s.surv.find(v => /^老|王太太/.test(v.name)) || s.surv[0]; L(`${o.name}裹着棉被说：「以前停电也熬过冬。人手够、菜园够吃，熬过这个冬天，日子就能过下去。」`); }
        } else if (prev === 'winter') s.winterIn = false;
      }
    }
    if (s.over) { s.over.score = score(s); L(s.over.reason, s.over.win ? 'good' : 'bad'); }
    if (!s.over && s.wx) rollWx(s);
    if (!s.over && s.start) plant(s);
    // 明晚会不会有巨汉：白天就能从远处的动静判断出来（工地旁边来得早、来得多）
    const hb = horde(s.day, s), bd = s.city === 'builders' ? [7, 14, 0.04, 0.35] : [10, 21, 0.03, 0.3];
    const bn = s.city === 'builders' ? 0.06 * awake(s).length : 0;   // 工地旁边的巢里会长出巨汉
    s.brute = !s.over && s.day >= bd[0] && ((hb.surge && s.day >= bd[1]) || rand(s) < clamp((s.day - bd[0] + 1) * bd[2], 0, bd[3]) + bn);
    // 军方空投：每 4 天一箱，落在还没收复的街区
    if (!s.over && s.city === 'airdrop' && s.day % 4 === 1) {
      const cand = coords(s).filter(([x, y]) => { const t = tile(s, x, y); return !t.owned && !t.camp && !t.nest && t.t !== 'radio' && distB(s, x, y) >= 2 && distB(s, x, y) <= 6; });
      if (cand.length) {
        const [x, y] = pick(s, cand), t = tile(s, x, y);
        t.food += 10; t.mat += 6; t.drop = true; t.seen = true;
        if (rand(s) < 0.3) t.gear.push('rifle');
        L(`直升机低低飞过，一箱补给落在${TYPES[t.t].name}（${x + 1},${y + 1}）。`, 'good');
      }
    }
    for (const v of s.surv) v.busy = 0;

    updateSeen(s);
    if (!s.over) rollEvent(s);
    syncFood(s);   // 早上的黑市、事件也可能动到存粮
    purgeForts(s);
    if (s.log.length > 240) s.log = s.log.slice(-240);
    return s;
  }

  function score(s) {
    return s.surv.length * 10 + owned(s).length * 5 + (s.over && s.over.win ? 50 : 0) + s.stats.recruited * 3;
  }

  // ---------- 早晨事件 ----------
  const KNOCK_TEXT = {
    2: '天亮前，有人在敲一楼的铁门。是一对母子，说已经两天没吃东西了。',
    3: '天亮前，铁门外站着一家三口。他们说在巷子里闻到你们煮饭的味道，求你们收留。',
  };
  const knockCost = n => n === 3 ? 5 : 3;
  const EVENTS = {
    draft: (s, p) => ({
      draft: true, title: '定一条楼规',
      text: p.text || '撑过了尸潮。天亮后大家聚在顶楼开会，要定一条新的楼规。',
      choices: p.opts.map(k => ({ key: k, line: RULES[k].line, label: RULES[k].name, note: RULES[k].desc, ok: true })),
    }),
    season: (s, p) => ({
      draft: true, title: '这是什么季节',
      text: '停电第三天。你推开顶楼的铁门，先看了看天。',
      choices: SEASON_ORDER.map(k => ({ key: k, line: SEASONS[k].start, label: SEASONS[k].name, note: SEASONS[k].desc, ok: true })),
    }),
    city: (s, p) => ({
      draft: true, title: '这座城怎么了',
      text: '停电第三天。从顶楼往外看，这座城已经不是原来的样子了。',
      choices: p.opts.map(k => ({ key: k, line: '城况', label: CITIES[k].name, note: CITIES[k].desc, ok: true })),
    }),
    origin: (s, p) => ({
      draft: true, title: '你以前是做什么的',
      text: '楼里的人推你当楼长，是因为你以前是……',

  Object.assign(EVENTS, {

  const campName = s => s.camp ? TYPES[tile(s, s.camp.x, s.camp.y).t].name : '';
  const campActive = s => !!(s.camp && s.camp.state === 'active');
  const mergeN = s => beds(s) - s.surv.length >= 3 ? 3 : 2;
  const medicFor = (s, id) => s.surv.find(u => u.id !== id && ready(u) && (tr(u, 'medic') || u.job === '护理师'));
  // 绑在地图上的事件挑地块时，避开牵挂、求救、营地
  const freeTile = (s, x, y) => { const t = tile(s, x, y); return !t.owned && !t.camp && !t.nest && t.t !== 'radio' && !isSos(s, x, y) && !wantKey(s).has(`${x},${y}`); };

  function campLeave(s, z, msg) {
    const t = tile(s, s.camp.x, s.camp.y);
    t.camp = false; t.z = z;
    s.camp.state = 'gone';
    if (msg) s.log.push({ d: s.day, tone: 'info', msg });
  }

  function burn(s, x, y) {
    const t = tile(s, x, y);
    Object.assign(t, { t: 'ruin', z: 0, scream: false, food: 0, mat: Math.floor(t.mat / 2), strip: 0, gutted: false, prog: 0, drop: false, gear: [], farm: false, till: 0 });
  }

  // 投奔的概率：有空床、人均存粮越多，越容易有人循着炊烟找上门
  function arrivalChance(s) {
    const free = beds(s) - s.surv.length, ratio = s.food / Math.max(1, s.surv.length);
    const th = has(s, 'commune') ? 3 : 4, k = has(s, 'commune') ? 1.6 : 1;
    if (free < 2 || ratio < th) return 0;
    return Math.min(0.6, (0.12 + 0.05 * (ratio - th)) * k * clamp(0.5 + avgMood(s) / 100, 0.7, 1.3));   // 据点气氛好，投奔的人多
  }

  function rollEvent(s) {
    if (has(s, 'trade') && s.mat >= 7) { s.mat -= 3; s.food += 2; s.log.push({ d: s.day, tone: 'info', msg: '黑市的人一早来过，用 3 木料换了 2 食物。' }); }
    // 换季的第一天定一条楼规；尸潮频繁的城市撑过尸潮也定一条
    const turn = s.start && s.day > 1 && (s.day - 1) % SEASON_LEN === 0, moon = s.city === 'moon' && s.day > 1 && (s.day - 1) % surgeEvery(s) === 0;
    if (turn || moon) {
      const opts = draftOpts(s);
      if (opts.length) { s.event = { id: 'draft', p: { opts, text: turn ? `入${SEASONS[s.season].name}了。大家聚在顶楼开会，要定一条新的楼规。` : null } }; return; }
    }
    // 事件链：到期的后续事件优先
    s.queue = s.queue || [];
    for (let i = 0; i < s.queue.length; i++) {
      const q = s.queue[i];
      if (q.day > s.day) continue;
      s.queue.splice(i--, 1);
      if (q.id === 'fever2') {
        const v = byId(s, q.p.id);
        if (!v) continue;
        if (!q.p.bit) { s.log.push({ d: s.day, tone: 'good', msg: `${v.name}退烧了，只是着凉。` }); continue; }
      }
      if (q.id === 'camp_revenge' && !(s.camp && s.camp.state === 'hostile')) continue;
      if (q.id === 'turn') { const v = byId(s, q.p.id); if (!v || v.inf !== -1) continue; }   // 人不在了，或者已经治好了
      s.event = { id: q.id, p: q.p };
      return;
    }
    const pa = arrivalChance(s);
    if (pa && rand(s) < pa) {
      const free = beds(s) - s.surv.length, ratio = s.food / Math.max(1, s.surv.length);
      s.event = { id: 'knock', p: { n: free >= 3 && ratio >= 7 ? 3 : 2 } };
      return;
    }
    if (rand(s) >= 0.3) return;
    const pool = ['knock', 'truck', 'trade'];
    const feud = s.rel.find(([a, b, k]) => k === 'feud' && byId(s, a) && byId(s, b));
    if (feud) pool.push('feud', 'feud');
    const spots = (types, d0, d1) => coords(s).filter(([x, y]) => types.includes(tile(s, x, y).t) && distB(s, x, y) >= d0 && distB(s, x, y) <= d1 && freeTile(s, x, y) && !tile(s, x, y).scream);
    const campSpots = s.camp || s.day < 4 ? [] : (spots(['school'], 3, 7).length ? spots(['school'], 3, 7) : spots(['house'], 3, 6));
    if (campSpots.length) pool.push('camp_meet', 'camp_meet');
    if (campActive(s)) { pool.push('camp_trade', 'camp_trade'); if (s.camp.rep >= 0) pool.push('camp_help'); if (s.camp.rep >= 3) pool.push('camp_merge', 'camp_merge', 'camp_merge'); }
    const ready_ = s.surv.filter(ready);
    if (s.day >= 6 && ready_.length >= 3 && !s.queue.some(q => q.id === 'fever2')) pool.push('fever');
    const sosSpots = s.sos || s.day < 3 ? [] : spots(['house', 'school', 'mart', 'hospital'], 2, 5);
    if (sosSpots.length) pool.push('sos');
    if (!s.dog && !s.dogSeen) pool.push('dog');
    if (s.day >= 5 && !s.deserterSeen) pool.push('deserter');
    const fireSpots = s.day < 5 ? [] : coords(s).filter(([x, y]) => { const t = tile(s, x, y); return t.seen && !['ruin', 'park'].includes(t.t) && distB(s, x, y) >= 2 && distB(s, x, y) <= 5 && freeTile(s, x, y); });
    if (fireSpots.length) pool.push('fire');
    const id = pick(s, pool);
    let p = {};
    if (id === 'feud') p = { a: feud[0], b: feud[1] };
    else if (id === 'knock') p = { n: 2 };
    else if (id === 'camp_meet') { const [x, y] = pick(s, campSpots); p = { x, y }; }
    else if (id === 'fever') p = { id: pick(s, ready_).id, bit: rand(s) < 0.35 };
    else if (id === 'sos') { const [x, y] = pick(s, sosSpots); p = { x, y, n: ri(s, 2, 3) }; }
    else if (id === 'fire') { const [x, y] = pick(s, fireSpots); p = { x, y }; }
    if (id === 'dog') s.dogSeen = true;
    if (id === 'deserter') s.deserterSeen = true;
    s.event = { id, p };
  }

  function draftOpts(s) {
    const pool = Object.keys(RULES).filter(k => !has(s, k)), opts = [];
    while (opts.length < 3 && pool.length) opts.push(pool.splice(Math.floor(rand(s) * pool.length), 1)[0]);
    return opts;
  }

  function campRaid(s, L) {
    const v = s.surv.filter(ready).sort((a, b) => b.fight - a.fight)[0];
    s.food += 6; s.mat += 4;

    if (k === 'decoy') { put(14, 11, 20, 1, '#8a8f94'); for (let u = 15; u < 33; u += 4) put(u + ((!REDUCED && tk % 2) ? 1 : 0), 12, 2, 2, u === 23 ? '#f0b04a' : '#c8ccd0'); }
  }
  // 据点本身：工事高了，一楼的窗焊上铁板、顶楼堆沙包哨位；铁门被撞坏会看得出来
  function baseFort(ox, oy, tk) {
    if (S.fort >= 4) for (const wx of [9, 31]) { px(ox + wx - 1, oy + 32, 9, 5, '#5d6670'); px(ox + wx - 1, oy + 32, 9, 1, '#8d939b'); px(ox + wx, oy + 34, 1, 1, '#c8ccd0'); px(ox + wx + 6, oy + 34, 1, 1, '#c8ccd0'); }
    if (S.fort >= 7) { for (let i = 0; i < 4; i++) px(ox + 22 + i * 2, oy + 6 - (i % 2), 3, 2, i % 2 ? '#cdb68a' : '#a8916a'); px(ox + 24, oy + 3, 2, 2, '#e7c39a'); px(ox + 24, oy + 5, 2, 1, '#74a6dc'); }
    const hp = S.wall / S.wallMax;

    if (hp < 0.25) { px(ox + 21, oy + 40, 4, 3, '#0c0d11'); px(ox + 20, oy + 39, 1, 1, '#c8ccd0'); if (!REDUCED && tk % 2) px(ox + 25, oy + 40, 1, 1, '#ffd27a'); }
  }
  function corners(ox, oy, col, len, o) {
    for (const [a, b, w, h] of [[0, 0, len, 2], [0, 0, 2, len], [TS - len, 0, len, 2], [TS - 2, 0, 2, len], [0, TS - 2, len, 2], [0, TS - len, 2, len], [TS - len, TS - 2, len, 2], [TS - 2, TS - len, 2, len]])

  function frameIn(ox, oy, c) { px(ox, oy, TS, 1, c); px(ox, oy + TS - 1, TS, 1, c); px(ox, oy, 1, TS, c); px(ox + TS - 1, oy, 1, TS, c); }
  // 今天白天的天气：雨丝、台风的斜雨、飘过的雾带、热浪的暖色、寒流的冷色和细雪、季风的风痕、霜、回南天的水珠；台风过后的积水
  function weather(tk) {
    const w = S.wxNow, still = REDUCED ? 0 : 1;
    if (w === 'thunder' && still && tk % 11 === 0) px(0, 0, 384, 384, 'rgba(235,240,255,.18)');   // 闪电
    if (['drizzle', 'rain', 'thunder', 'outer', 'typhoon'].includes(w)) {
      const big = w === 'typhoon' || w === 'outer', n = { drizzle: 35, rain: 100, thunder: 80, outer: 90, typhoon: 150 }[w];
      if (big || w === 'thunder') px(0, 0, 384, 384, w === 'typhoon' ? 'rgba(8,12,22,.22)' : 'rgba(8,12,22,.10)');
      ctx.globalAlpha = w === 'typhoon' ? 0.42 : w === 'drizzle' ? 0.2 : 0.3;
      for (let i = 0; i < n; i++) {
        const sx = Math.floor(hash(i, 7, 500) * 384), sy = Math.floor(hash(i, 9, 501) * 384), off = still * (tk * (big ? 37 : 23)) % 384;
        const yy = (sy + off) % 384, xx = (sx - Math.floor(off / (big ? 1.4 : 3)) + 384) % 384;
        if (big) { px(xx, yy, 1, 3, '#b8c8e0'); px(xx - 1, yy + 3, 1, 3, '#b8c8e0'); px(xx - 2, yy + 6, 1, 2, '#b8c8e0'); }
        else if (w === 'drizzle') px(xx, yy, 1, 2, '#9fb2cf');
        else { px(xx, yy, 1, 5, '#9fb2cf'); px(xx - 1, yy + 5, 1, 2, '#9fb2cf'); }
      }
      ctx.globalAlpha = 1;
    } else if (w === 'humid') {
      px(0, 0, 384, 384, 'rgba(120,170,190,.08)');
      for (let i = 0; i < 60; i++) { const yy = (Math.floor(hash(i, 4, 640) * 384) + still * Math.floor(tk / 3) * (i % 3)) % 384; px(Math.floor(hash(i, 5, 641) * 384), yy, 1, 2, 'rgba(170,210,230,.45)'); }
    } else if (w === 'monsoon') {
      px(0, 0, 384, 384, 'rgba(110,140,190,.06)');
      for (let i = 0; i < 14; i++) { const y = Math.floor(hash(i, 2, 650) * 384), x = (Math.floor(hash(i, 3, 651) * 520) - still * tk * (6 + i % 4) % 520 + 520) % 520 - 80; px(x, y, 30 + i % 3 * 10, 1, 'rgba(225,235,245,.20)'); }
    } else if (w === 'frost') {
      px(0, 0, 384, 384, 'rgba(215,230,245,.10)');
      for (let i = 0; i < 90; i++) px(Math.floor(hash(i, 6, 660) * 384), Math.floor(hash(i, 7, 661) * 384), 1, 1, 'rgba(240,246,252,.6)');
    } else if (w === 'fog') {
      px(0, 0, 384, 384, 'rgba(170,178,190,.10)');
      for (let i = 0; i < 12; i++) {   // 一条条雾带慢慢往右飘
        const y = Math.floor(hash(i, 3, 610) * 380), w2 = 70 + Math.floor(hash(i, 4, 611) * 90), x = (Math.floor(hash(i, 5, 612) * 520) + still * tk * (1 + i % 3)) % 520 - 110;
        px(x, y, w2, 6, 'rgba(200,206,216,.12)'); px(x + 12, y - 4, w2 - 24, 4, 'rgba(200,206,216,.09)'); px(x + 20, y + 6, w2 - 40, 3, 'rgba(200,206,216,.07)');
      }
    } else if (w === 'heat') {
      px(0, 0, 384, 384, 'rgba(255,160,70,.07)');
      if (still) for (let i = 0; i < 8; i++) { const y = (Math.floor(hash(i, 6, 620) * 384) - tk * 2 + 3840) % 384; px(Math.floor(hash(i, 7, 621) * 340), y, 24, 1, 'rgba(255,230,180,.10)'); }
    }
    if (S.flood === S.day) {   // 台风过后淹水：一层浑水，水波慢慢晃
      px(0, 0, 384, 384, 'rgba(70,95,110,.16)');
      for (let i = 0; i < 24; i++) { const x = Math.floor(hash(i, 8, 670) * 360) + (still ? Math.round(Math.sin((tk + i * 7) / 4) * 2) : 0); px(x, Math.floor(hash(i, 9, 671) * 384), 10, 1, 'rgba(190,210,220,.22)'); }
    }
    if (w === 'cold') {
      px(0, 0, 384, 384, 'rgba(110,150,215,.10)');
      for (let i = 0; i < 45; i++) {
        const sx = Math.floor(hash(i, 8, 630) * 384), sy = Math.floor(hash(i, 2, 631) * 384), off = still * tk * 3;

  }
  let tick = 1;
  // 视角：画布一次看 8×8 格，大街区可以拖动、用方向键或点小地图移过去。cam 是左上角的像素坐标
  const VIEW = 384;
  function clampCam() { cam.x = Math.max(0, Math.min(S.W * TS - VIEW, Math.round(cam.x))); cam.y = Math.max(0, Math.min(S.H * TS - VIEW, Math.round(cam.y))); }
  // 选中的格子换了、又不在视野里，就把视角挪到刚好看得见（留一格边）
  function follow() {

  function drawMap() {

  // 小地图：大街区才有。我方金色、据点白色、找到的巢红色、电台蓝色，今晚守不住的边界闪红，框是现在看的范围
  const mini = $('mini'), mctx = mini.getContext('2d');

        : t.nest && t.nest.found ? '#a8323a' : t.t === 'radio' ? '#4a7ad8' : t.z >= 4 ? '#3a2a2e' : t.z ? '#2c2c34' : '#3a4046';

  // 拖动地图：按住移动超过几个像素就算拖，松手那下不算点击

  addEventListener('pointerup', () => { if (drag && drag.moved) setTimeout(() => { drag = null; }, 0); else drag = null; });

  cv.addEventListener('mousemove', e => {

  // ---------- 文本工具 ----------

  // 天气：住户各说各的。b 是说话的口气（跟准不准无关），老寒腿变天时会说膝盖疼
  const WXN = k => Sim.WX[k].name;
  const QUOTE = [(n, sg) => `${sg}，今晚大概会${n}吧，我也说不准。`, (n, sg) => `${sg}，今晚应该是${n}。`, (n, sg) => `${sg}，今晚肯定${n}，错不了！`];
  const quote = (o, when = '今晚') => (o.knee ? (Sim.KNEE_WX.includes(o.g) ? '膝盖疼得厉害，要变天了。' : '膝盖不疼。') : '') + QUOTE[o.b](WXN(o.g), o.sign || '我看天色').replace('今晚', when);
  const whoSaid = f => f.radio ? '广播' : f.say[f.pick] ? f.say[f.pick].name : '';
  const recTxt = r => r[1] ? `看天 ${r[0]}/${r[1]}` : '还没说过天气';
  const SEASON_IC = { early: 'fog', spring: 'sunny', plum: 'rain', summer: 'heat', autumn: 'typhoon', late: 'monsoon', winter: 'cold' };
  function wxHud() {
    const F = Sim.forecast(S);
    if (!F) return '';
    const g = F.tonight;
    return `<span class="res" title="今天白天：${WXN(F.now)}。${Sim.WX[F.now].day}${F.flood ? '\n' + Sim.FLOOD_TXT : ''}\n今晚听${whoSaid(g)}的：${WXN(g.g)}。${Sim.WX[g.g].night}\n点“今晚”分页看大家怎么说。">${ic(F.flood ? 'flood' : F.now, WXN(F.now))}${WXN(F.now)}${F.flood ? '·淹水' : ''}<small>·今晚${WXN(g.g)}${g.radio ? '' : '?'}</small></span>`;
  }

  // 人心：档位和最重的一条原因；moodHtml 列出记着的事和眼前的处境
  function moodTip(v) {
    const lv = Sim.moodLv(S, v), why = moodWhy(v)[0];
    return `${Sim.MOOD_LV[lv].name}${why ? '（' + why[0] + '）' : ''}`;
  }
  function moodWhy(v) {
    const mem = (v.mem || []).map(m => [Sim.memTxt(m), Sim.memNow(S, m), m.d]).filter(x => x[1] !== 0);
    return mem.concat(Sim.moodNow(S, v).map(x => [x[0], x[1]])).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  }
  function moodHtml(v) {
    const lv = Sim.moodLv(S, v), eff = ['干活、守夜 -1，不肯去端巢和丧尸多的地方；夜里可能一走了之', '干活、守夜 -1，不肯去端巢和丧尸多的地方', '', '白天干活多出一把力'][lv];
    const rows = moodWhy(v).slice(0, 4).map(([t, w, d]) => `<span class="${w > 0 ? 'c-good' : 'c-red'}">${w > 0 ? '+' : '-'}</span> ${t}${d ? `<span class="dim">（第 ${d} 天）</span>` : ''}`);
    const can = Sim.canChat(S, v.id);
    return `<div class="box ${lv <= 1 ? 'fail' : lv === 3 ? 'safe' : ''}"><div class="row2"><span class="${['c-red', 'c-amber', '', 'c-good'][lv]}">${v.name} · ${Sim.MOOD_LV[lv].name}</span><button class="btn" data-chat="${v.id}" ${can ? '' : 'disabled'} title="${can ? '楼长每天能找一个人聊一次，不占人手' : '今天已经找人聊过了'}">找他聊聊</button></div>${eff ? `<span class="dim">${eff}</span><br>` : ''}${rows.length ? rows.join('<br>') : '<span class="dim">心里没什么事。</span>'}</div>`;
  }

  function renderPeople() {
    $('pcount').textContent = `${S.surv.length} 人`;
    const box = $('people'), top = box.scrollTop;
    box.innerHTML = S.surv.map(v => {
      const tt = taskText(v), out = !Sim.ready(v);
      const T2 = Sim.TRAITS[v.trait];
      return `<button class="pc${v.id === selSurv ? ' sel' : ''}${out ? ' out' : ''}" data-id="${v.id}" aria-pressed="${v.id === selSurv}" title="${v.job} · ${moodTip(v)} · ${T2 ? T2.name + '：' + T2.desc : ''}${v.gear ? ' · 带着' + Sim.GEAR[v.gear].name : ''} · ${recTxt(v.rec || [0, 0])}">
        <canvas width="36" height="36" data-pid="${v.id}"></canvas>
        <span class="nm"><b class="${['c-red', 'c-amber', '', 'c-good'][Sim.moodLv(S, v)]}">${v.name}</b>${T2 ? `<span class="trait">${T2.name}</span>` : `<span>${v.job}</span>`}</span>
        <span class="sk">${ic('fist', '战斗')}<em>${v.fight}</em>${ic('bag', '搜刮')}<em>${v.scav}</em>${ic('ham', '建造')}<em>${v.build}</em><span class="job">${v.job}</span></span>
        <span class="tk${tt.hurt ? ' hurt' : ''}">${tt.t}</span>
        ${v.want ? `<span class="kin" title="${v.want.txt}">${ic('flag', '牵挂')}</span>` : ''}
        ${v.gear ? `<span class="gear" title="${Sim.GEAR[v.gear].name}：${Sim.GEAR[v.gear].desc}">${ic(v.gear, Sim.GEAR[v.gear].name)}</span>` : ''}
      </button>`;
    }).join('') || '<p class="dim">楼里已经没有人了。</p>';
    box.scrollTop = top;
    box.querySelectorAll('canvas[data-pid]').forEach(c => portrait(c, Sim.byId(S, +c.dataset.pid)));
    box.querySelectorAll('.pc').forEach(el => el.onclick = () => {
      const id = +el.dataset.id;
      selSurv = selSurv === id ? null : id;
      const v = Sim.byId(S, id);
      if (selSurv != null && v.task.x != null) selTile = { x: v.task.x, y: v.task.y };
      tab = 'tile'; render();
    });
  }

  function renderCap() {
    const v = selSurv != null ? Sim.byId(S, selSurv) : null;
    if (!v) { $('mapcap').innerHTML = `<span>先在左边选人，再点地块派工。</span><span>${S.W > 8 ? '悬停看名字，方向键移动，按住能拖动地图。' : '悬停地块看名字，方向键也能移动。'}</span>`; return; }
    const T2 = Sim.TRAITS[v.trait], rel = relOf(v.id);
    $('mapcap').innerHTML = `<span>派 <span class="c-amber">${v.name}</span>（${v.job}）去哪？点地块。${rel ? ' ' + rel : ''}</span>
      <span>${v.gear ? `${ic(v.gear)}<span class="c-amber">${Sim.GEAR[v.gear].name}</span> · ` : ''}${T2 ? `<span style="color:#d6b98a">${T2.name}</span>：${T2.desc}` : ''}</span>`;
  }

  // ---------- 右侧面板 ----------
  const TASKS = {
    rescue: ['救人', '把被困的人接回来'],
    defend: ['驻守', '夜里守在这里'],
    fortify: ['加固', '耗 2 材料'],
    scav: ['搜刮', '带回食物和材料'],
    clear: ['清理丧尸', '清干净才能收复或拆除'],
    claim: ['收复', '封窗、清路、接水电'],
    strip: ['拆除', '换成材料'],
    farm: ['开垦菜园', '要有种子才种得出东西'],
    grove: ['种树', '废墟上种一片树，长成后每天出木料'],
    log: ['伐木', '整片砍掉换木料，树要从头再长'],
    work: ['驻场开工', '机器开一天掉 1 点耐久，会吵'],
    fix: ['维修机器', `耗 ${Sim.costTxt(Sim.FIX)}`],
    study: ['研究', '在据点研究科技，夜里照样守据点'],
    talk: ['谈心', '陪心情最差的人聊一天，夜里照样守据点'],
    rest: ['歇一天', '放自己一天假，人心回升，夜里照样守据点'],
    hot: ['搭温室', '4 木料，冬天照样长'],
  };
  const STATE_TXT = { safe: '守得住', risk: '看运气', fail: '守不住' };
  const STATE_CLS = { safe: 'c-good', risk: 'c-amber', fail: 'c-red' };
  const WANT_HOW = { rescue: '派人来救人，谁去都行。', fetch: '来这里搜刮就能顺手找到。', reclaim: '收复这里就算达成。', protect: '期限内别拆这里就行。' };
  function relevant(t, x, y, k) {
    const base = isBaseT(t);
    if (k === 'defend') return t.owned;
    if (k === 'fortify') return t.owned && (base || t.bar < Sim.barMax(S));
    if (k === 'strip') return !base && t.strip > 0 && t.z === 0 && !t.nest;   // 没找到的巢那格总有丧尸，本来就拆不了
    if (k === 'scav') return t.food + t.mat > 0 || t.gear.length > 0 || (t.items || []).length > 0 || (t.books || []).length > 0;
    if (k === 'clear') return !t.owned && (t.nest && t.nest.found ? Sim.nestReach(S, x, y) : t.z > 0 && Sim.frontier(S, x, y));
    if (k === 'claim') return !t.owned && t.z === 0 && !t.nest && Sim.frontier(S, x, y);
    if (k === 'farm') return t.owned && !base && !t.farm && !t.grove && t.t !== 'park';
    if (k === 'grove') return t.owned && !base && !t.farm && !t.grove && (t.t === 'ruin' || t.gutted);
    if (k === 'log') return t.owned && Sim.grown(t);
    if (k === 'work' || k === 'fix') return t.owned && !!Sim.WORKS[t.t] && !t.gutted;
    if (k === 'study' || k === 'talk' || k === 'rest') return base;
    if (k === 'hot') return t.owned && !t.hot && Sim.tech(S, 'hothouse') && Sim.plots(S).includes(t);
    if (k === 'rescue') return (S.sos && S.sos.x === x && S.sos.y === y) || S.surv.some(u => u.want && u.want.k === 'rescue' && u.want.x === x && u.want.y === y);
  }
  const onTile = (v, x, y) => isBaseT(Sim.tile(S, x, y)) ? (v.task.x == null || (v.task.x === x && v.task.y === y)) : (v.task.x === x && v.task.y === y);

  function renderSide() {
    $('tabs').querySelectorAll('button').forEach(b => { b.setAttribute('aria-selected', b.dataset.tab === tab); b.onclick = () => { tab = b.dataset.tab; renderSide(); }; });
    const nFail = PLAN.fronts.filter(f => f.state === 'fail').length;
    $('tabs').querySelector('[data-tab="night"]').innerHTML = `今晚${nFail ? ` <span class="c-red">!${nFail}</span>` : ''}`;
    const body = $('sidebody');
    body.innerHTML = tab === 'tile' ? tileHtml() : tab === 'night' ? nightHtml() : tab === 'gear' ? gearHtml() : tab === 'tech' ? techHtml() : logHtml();
    body.scrollTop = 0;
    body.querySelectorAll('[data-task]').forEach(b => b.onclick = () => commit(Sim.setTask(S, selSurv, ['study', 'talk', 'rest'].includes(b.dataset.task) ? { k: b.dataset.task } : { k: b.dataset.task, x: selTile.x, y: selTile.y })));
    body.querySelectorAll('[data-research]').forEach(b => b.onclick = () => commit(Sim.setResearch(S, b.dataset.research)));
    body.querySelectorAll('[data-chat]').forEach(b => b.onclick = () => commit(Sim.chat(S, +b.dataset.chat)));
    body.querySelectorAll('[data-party]').forEach(b => b.onclick = () => commit(Sim.setParty(S, b.dataset.party === '1')));
    body.querySelectorAll('[data-gen]').forEach(b => b.onclick = () => commit(Sim.setGen(S, b.dataset.gen === '1')));
    body.querySelectorAll('[data-study]').forEach(b => b.onclick = () => commit(Sim.setTask(S, selSurv, { k: 'study' })));
    body.querySelectorAll('[data-recall]').forEach(b => b.onclick = () => commit(Sim.setTask(S, +b.dataset.recall, { k: 'defend' })));
    body.querySelectorAll('[data-give]').forEach(b => b.onclick = () => commit(Sim.equip(S, selSurv, b.dataset.give)));
    body.querySelectorAll('[data-unequip]').forEach(b => b.onclick = () => commit(Sim.equip(S, +b.dataset.unequip, null)));
    body.querySelectorAll('[data-heal]').forEach(b => b.onclick = () => commit(Sim.useMedkit(S, +b.dataset.heal)));
    body.querySelectorAll('[data-craft]').forEach(b => b.onclick = () => commit(Sim.setTask(S, selSurv, { k: 'craft', item: b.dataset.craft })));
    body.querySelectorAll('[data-fx]').forEach(b => b.onclick = () => { selTile = { x: +b.dataset.fx, y: +b.dataset.fy }; tab = 'tile'; render(); });
    body.querySelectorAll('[data-edge]').forEach(b => b.onclick = () => { selEdge = +b.dataset.edge; render(); });
    body.querySelectorAll('[data-build]').forEach(b => b.onclick = () => commit(Sim.setTask(S, selSurv, { k: 'build', x: selTile.x, y: selTile.y, item: b.dataset.build })));
    body.querySelectorAll('[data-sow]').forEach(b => b.onclick = () => commit(Sim.setCrop(S, selTile.x, selTile.y, b.dataset.sow || null)));
    body.querySelectorAll('[data-eatseed]').forEach(b => b.onclick = () => commit(Sim.eatSeeds(S, b.dataset.eatseed)));
    body.querySelectorAll('[data-trust]').forEach(b => b.onclick = () => commit(Sim.trustWx(S, +b.dataset.trust)));
  }

  const meter = (def, lo, hi) => { const max = Math.max(hi, def) + 2; return `<span class="bar2"><span class="d" style="width:${def / max * 100}%"></span><span class="t" style="left:${lo / max * 100}%;width:${Math.max(1, hi - lo) / max * 100}%"></span></span>`; };

  function tileHtml() {
    const { x, y } = selTile, t = Sim.tile(S, x, y), ty = T[t.t], base = isBaseT(t), reach = Sim.reachable(S, x, y);
    let chip;
    if (!t.seen) chip = '<span class="chip dim">未探明</span>';
    else if (base) chip = '<span class="chip c-amber">据点</span>';
    else if (t.owned) chip = '<span class="chip c-amber">我方</span>';
    else if (fogged(t, reach)) chip = '<span class="chip dim">雾里看不清</span>';
    else if (t.z > 0) chip = `<span class="chip c-z">丧尸 ${t.z}</span>`;
    else chip = '<span class="chip c-good">暂时安全</span>';
    if (t.scream) chip += '<span class="chip c-red">尖叫者</span>';
    const nest = t.nest && t.nest.found && !t.nest.sleep ? t.nest : null, dorm = t.nest && t.nest.found && t.nest.sleep;
    if (nest) chip += `<span class="chip c-red">${nest.lv} 级尸巢</span>`;
    if (dorm) chip += '<span class="chip c-red">休眠的尸巢</span>';
    if (t.drop) chip += '<span class="chip c-good">空投</span>';
    let h = `<div class="th"><b>${Sim.tname(t)}</b>${chip}<span class="dim">${x + 1},${y + 1}</span></div>
      <div class="desc">${t.owned && (t.farm || (t.t === 'park' && !t.gutted)) ? `${t.t === 'park' ? '公园改的菜园' : t.t === 'ruin' || t.gutted ? '开垦出来的菜园' : ty.desc + '院子里开了几畦菜'}，每天收 ${Sim.farmYield(t)} 份再乘作物这一季的倍率。${cropTxt(t)}` : t.farm ? '菜园荒了。' : t.gutted ? '拆了一部分，原本的用处没了。' : t.t === 'radio' && S.city === 'noradio' ? '电塔倒了，这里修好了也叫不来救援。' : ty.desc}${!t.owned && t.prog ? ` 施工 ${t.prog}/${ty.cost}。` : ''}</div>`;
    { const sv = selSurv != null ? Sim.byId(S, selSurv) : null; if (sv) h += moodHtml(sv); }
    if (t.scream) h += `<div class="box fail"><span class="c-red">尖叫者</span><br><span class="dim">它让这里和四周的丧尸长得更快，夜里会把尸群引向它那一侧。把这一格清空就能解决它。</span></div>`;
    if (t.seen && !t.owned && !nest && Sim.nestHint(S, x, y)) h += `<div class="box fail dim">这一带的丧尸会自己繁殖，附近三格以内藏着一个没找到的尸巢。多看几块地，范围就能缩小。</div>`;
    if (dorm) h += `<div class="box fail"><span class="c-red">休眠的尸巢</span><br><span class="dim">一团还没醒的卵，现在不繁殖、不喷丧尸，但迟早会醒。趁它没醒端掉最省事：派人来清理，离地盘两格以内就能直接杀过去。</span></div>`;
    if (nest) {
      const n = nest, max = Sim.nestHp(n.lv), nextLv = n.lv < 3 ? n.born + 10 * n.lv : 0;
      h += `<div class="box fail"><span class="c-red">尸巢 · ${n.lv} 级 · 巢还剩 ${n.hp}/${max}</span><br><span class="dim">每晚往两格内喷丧尸，还让整个街区的尸群 +${Math.round(Sim.NEST_HORDE * n.lv * 100)}%；离巢 ${Sim.NEST_R} 格以内的丧尸会自己繁殖。${nextLv && S.day < nextLv ? `第 ${nextLv} 天会长大一级。` : ''}<br>端巢：派人来清理，先砍游荡的丧尸（这一格最多 ${Sim.nestZ(n.lv)} 只），多出来的力气才砍得到巢。巢每晚长回 1 点，最好几个人同一天一起上。离地盘两格以内就能直接杀过去，不用先打通路，但这些人今晚不在家。</span></div>`;
    }
    if (t.seen && !base) h += `<div class="kv">${ic('food')}${t.food}　${ic('mat')}${t.mat}${t.strip > 0 ? `　<span class="dim">可拆 ${t.strip}</span>` : ''}</div>`;
    if (t.seen && ((t.items || []).length || (t.books || []).length)) h += `<div class="box kin dim">${(t.items || []).length ? `翻得到：<span class="c-amber">${t.items.map(k => Sim.ITEMS[k].name).join('、')}</span>。` : ''}${(t.books || []).length ? `有 ${t.books.length} 本书。` : ''}搜刮、拆除或收复这里就能带回去，研究用得上。</div>`;
    if (t.seen && t.gear.length) h += `<div class="box kin dim">地上有：${t.gear.map(k => `${ic(k)}<span class="c-amber">${Sim.GEAR[k].name}</span>`).join('、')}。搜刮、拆除或收复这里就能带回去。</div>`;
    if (t.camp) {
      const hostile = S.camp && S.camp.state === 'hostile';
      h += `<div class="box ${hostile ? 'fail' : 'kin'}"><span class="${hostile ? 'c-red' : 'c-kin'}">${hostile ? '结了仇的那伙人' : '另一伙幸存者'}</span><br><span class="dim">${hostile ? '你们抢过他们，他们迟早会找上门。' : '这里是他们的地盘，不能搜刮、清理或收复。他们在的时候，替你挡住了这一侧的尸群。'}</span></div>`;
    }
    if (S.sos && S.sos.x === x && S.sos.y === y) {
      const d = S.sos.until - S.day;
      h += `<div class="box kin"><span style="color:#74a6dc">求救信号：${S.sos.n} 个人困在这里</span><br><span class="dim">${d <= 0 ? '今晚是最后期限。' : `还剩 ${d} 天。`}派人来救人就能接回来。${S.sos.promised ? '你答应过他们。' : ''}${reach ? '' : '先把地盘推过来。'}</span></div>`;
    }
    for (const u of S.surv.filter(u => u.want && u.want.x === x && u.want.y === y)) {
      const d = daysLeft(u.want);
      h += `<div class="box kin"><span class="c-kin">${ic('flag')} ${u.name}：${u.want.txt}</span><br><span class="dim">${d <= 0 ? '今晚是最后期限。' : `还剩 ${d} 天。`}${WANT_HOW[u.want.k]}${reach ? '' : '先把地盘推过来。'}</span></div>`;
    }
    if (t.owned) {
      const f = PLAN.fronts.find(f => f.x === x && f.y === y);
      if (f) {
        const d = f.def;
        h += `<div class="box ${f.state}">${ic('moon')} 今晚冲击 ${f.lo}–${f.hi}，防御 ${d.total}，<span class="${STATE_CLS[f.state]}">${STATE_TXT[f.state]}</span>
          <div style="margin:3px 0">${meter(d.total, f.lo, f.hi)}</div>
          <span class="dim">${base ? '工事' : '路障'} ${d.barRaw !== d.bar ? `${d.barRaw}→<span class="c-red">${d.bar}</span>（巨汉）` : d.bar}${base ? '' : '/' + Sim.barMax(S)} · 建筑 ${d.place} · 驻守 ${d.n} 人 +${d.people}${d.works ? ` · 围栏 +${d.works}` : ''}${d.trap ? ` · 陷阱 ${d.trap}` : ''}${d.tower ? ` · 哨位 +${d.tower}` : ''}${f.lit ? ' · 探照灯照着' : ''}</span></div>`;
      } else h += `<div class="box safe dim">${ic('moon')} 在地盘内侧，今晚安全。</div>`;
    }
    const v = selSurv != null ? Sim.byId(S, selSurv) : null;
    if (t.owned && Sim.WORKS[t.t] && !t.gutted) { const Wk = Sim.WORKS[t.t], c = Sim.cond(t); h += `<div class="box ${c > 0 ? 'safe' : 'fail'} dim">工厂：${Wk.name}，${Object.keys(Wk.use).length ? `每人用 ${Sim.costTxt(Wk.use)}、` : ''}出 ${Sim.RES[Wk.out].name}。机器耐久 <span class="${c > 2 ? 'c-good' : 'c-red'}">${c}/${Sim.COND_MAX}</span>，开工一天掉 1，掉到 0 就停。开机的那天，旁边的街区可能多出丧尸。</div>`; }
    if (base) {   // 聚餐
      const on = S.party === S.day, n = Sim.partyCost(S), wait = S.lastParty != null ? Sim.PARTY_GAP - (S.day - S.lastParty) : 0;
      h += `<div class="box ${on ? 'safe' : ''}"><div class="row2"><span>${on ? '<span class="c-good">今晚聚餐</span>' : '聚餐'}</span>${on ? '<button class="btn" data-party="0">取消</button>' : `<button class="btn" data-party="1" ${Sim.canParty(S) ? '' : 'disabled'}>今晚办一桌</button>`}</div><span class="dim">吃完饭再多摆一桌，多吃 ${n} 份（现在有 ${S.food}），大家人心都往上走；桌上越杂越好，隔太近效果减半。${wait > 0 ? `还要等 ${wait} 天才能再办。` : ''}</span></div>`;
    }
    if (t.owned) h += edgeHtml(t, x, y, v) + cropHtml(t, x, y);
    if (t.grove) h += `<div class="box safe dim">树林：${Sim.grown(t) ? `长成了，每天修枝 +1 木料；也能派人整片砍掉换 ${Sim.LOG} 木料。` : `还要长 ${Math.ceil(Sim.GROVE - t.grove.g)} 天（冬天不长，梅雨长得快）。`}</div>`;
    const byBike = !reach && v && t.seen && Sim.bikeReach(S, v, x, y);
    const byRaid = !reach && t.seen && Sim.nestReach(S, x, y);
    if (t.seen && (nest || dorm) && !reach && !byRaid) return h + `<div class="dim">${S.wxNow === 'typhoon' ? '台风天出不了远门，只能端紧挨着地盘的巢。' : '离地盘太远。地盘推到离这里两格以内，就能派人直接来端巢。'}</div>`;
    if (!t.seen || (!reach && !byBike && !byRaid)) return h + `<div class="dim">${S.wxNow === 'typhoon' ? '台风天只能去相邻的街区，骑车、远征端巢都不行。' : `离地盘太远。先收复相邻的街区${S.surv.some(u => u.gear === 'bike') ? '，或者让骑脚踏车的人去' : ''}。`}</div>`;
    if (t.camp) return h;
    if (byBike) h += `<div class="dim">${v.name}骑脚踏车能到这里。</div>`;
    const keys = (t.owned ? ['rescue', 'defend', 'fortify', 'study', 'talk', 'rest', 'work', 'fix', 'hot', 'log', 'grove', 'farm', 'scav', 'strip'] : ['rescue', 'scav', 'clear', 'claim', 'strip'])
      .filter(k => relevant(t, x, y, k) && (reach || byBike || k === 'clear'));
    if (!keys.length) return h + `<div class="dim">这里没什么可做的。</div>`;
    if (!v) h += `<div class="c-amber">在左边选一个住户来派工。</div>`;
    h += `<div class="acts">` + keys.map(k => {
      let [name, note] = TASKS[k];
      if (k === 'fortify') { name = base ? '加固工事' : '堆路障'; note = base ? `工事+1~2，修铁门，耗 ${Sim.costTxt(Sim.COST.base)}` : `路障 ${t.bar}/${Sim.barMax(S)}，+1~2，耗 ${Sim.costTxt(Sim.COST.bar)}`; }
      if (k === 'defend' && base) name = '留守';
      if (k === 'clear' && (nest || dorm)) { name = '端巢'; note = '几个人同一天一起上'; }
      if (k === 'strip') note = S.surv.some(u => u.want && u.want.k === 'protect' && u.want.x === x && u.want.y === y) ? '有人不准拆，拆了会结仇' : (t.owned ? '换材料，加成立刻没了' : '一次拿走大量材料');
      const home = ['study', 'talk', 'rest'].includes(k), ok = v && (home ? Sim.canDo(S, v, k) : Sim.canDo(S, v, k, x, y));
      const already = v && v.task.k === k && onTile(v, x, y);
      let sub = note, risk = '';
      if (ok) {
        const p = Sim.preview(S, v, k, x, y);
        sub = p.gain || note;
        if (k === 'scav' || k === 'clear' || k === 'rescue') risk = `<span class="${riskCls(p.risk)}">伤${pct(p.risk)}</span>`;
      }
      const label = v && already ? `${v.name}正在${name}` : name;
      return `<button class="btn act" data-task="${k}" ${ok && !already ? '' : 'disabled'}><span>${label}</span><span>${risk}</span><small>${v && !Sim.ready(v) ? `${v.name}现在出不了门` : sub}</small></button>`;
    }).join('') + `</div>`;
    const here = S.surv.filter(u => Sim.ready(u) && onTile(u, x, y) && !(base && u.task.x == null && u.task.k === 'defend'));
    if (here.length) h += `<div class="here dim">在这里：${here.map(u => `${u.name}·${LABEL[u.task.k]} <button data-recall="${u.id}">叫回</button>`).join('，')}</div>`;
    return h;
  }

  // 边上的工事：先点一条边，再选造什么
  let selEdge = null;
  function edgeHtml(t, x, y, v) {
    const ed = Sim.outEdges(S, x, y);
    if (!ed.length) return '';
    if (!ed.includes(selEdge)) selEdge = ed[0];
    let h = `<div class="gh">边上的工事 <span class="dim">每条朝外的边能造一样</span></div><div class="edges">`;
    h += ed.map(d => { const f = Sim.fortAt(S, x, y, d); return `<button class="btn edge${d === selEdge ? ' sel' : ''}" data-edge="${d}">朝${Sim.DIRS[d][2]}：${f ? `<span class="c-amber">${Sim.FORTS[f.k].name}</span>${f.sprung ? '<span class="c-red">（要重新布置）</span>' : ''}` : '<span class="dim">空</span>'}</button>`; }).join('') + `</div>`;
    const cur = Sim.fortAt(S, x, y, selEdge);
    h += `<div class="acts">` + Object.keys(Sim.FORTS).filter(k => !Sim.FORTS[k].tech || Sim.tech(S, Sim.FORTS[k].tech)).map(k => {
      const F = Sim.FORTS[k], item = `${k}:${selEdge}`, ok = v && Sim.ready(v) && Sim.canDo(S, v, 'build', x, y, item) && Sim.canPay(S, F.cost) && !(cur && cur.k === k);
      const on = v && v.task.k === 'build' && v.task.item === item && v.task.x === x && v.task.y === y;
      return `<button class="btn act" data-build="${item}" ${ok && !on ? '' : 'disabled'}><span>${on ? `${v.name}正在造${F.name}` : `朝${Sim.DIRS[selEdge][2]}造${F.name}`}</span><span class="dim">${Sim.costTxt(F.cost)}</span><small>${cur && cur.k === k ? '已经有了' : !Sim.canPay(S, F.cost) ? '材料不够' : F.desc}${cur && cur.k !== k ? `（会拆掉${Sim.FORTS[cur.k].name}）` : ''}</small></button>`;
    }).join('') + `</div>`;
    if (!v) h += `<div class="dim">选一个人来造，一天造好，造完留在这里守夜。</div>`;
    return h;
  }
  // 菜园种什么：自己选，或者交给自动（这一季收成最好的）
  function cropHtml(t, x, y) {
    if (!(t.farm || (t.t === 'park' && !t.gutted))) return '';
    return (t.hot ? `<div class="box safe dim">温室：冬天照样长、不怕霜，冬天每天烧 1 木料（烧不起就跟露天一样）。</div>` : '') + `<div class="gh">种什么 <span class="dim">选了就马上用一包种子换种</span></div><div class="edges">` +
      `<button class="btn edge${!t.sow ? ' sel' : ''}" data-sow="">自动</button>` +
      Object.keys(Sim.CROPS).map(k => `<button class="btn edge${t.sow === k ? ' sel' : ''}" data-sow="${k}" ${(S.seeds[k] || 0) > 0 || t.sow === k ? '' : 'disabled'}>${FN(k)}<span class="dim">×${S.seeds[k] || 0}</span></button>`).join('') + `</div>`;
  }

  // 粮仓：按种类合计，写出最快几天后坏
  const FN = k => Sim.FOODS[k].name;
  function pantryRows() {
    const by = {};
    for (const b of S.pantry || []) { const o = by[b.k] = by[b.k] || { n: 0, exp: 0 }; o.n += b.n; if (b.exp && (!o.exp || b.exp < o.exp)) o.exp = b.exp; }
    return Object.keys(Sim.FOODS).filter(k => by[k]).map(k => ({ k, n: by[k].n, left: by[k].exp ? by[k].exp - S.day : null }));
  }
  const leftTxt = r => r.left == null ? '不会坏' : r.left <= 0 ? '今晚就坏' : `最快 ${r.left} 天后坏`;
  const seedTxt = () => Object.keys(Sim.CROPS).map(k => `${FN(k)} ${S.seeds[k] || 0}`).join('、');
  // 粮食预报：光靠存粮和菜园能撑多久
  function aheadTxt() {
    const a = Sim.foodAhead(S);
    const t = a.short == null ? `光靠存粮和菜园，接下来 ${a.H} 天都够吃（最少还剩 ${a.low} 份）。` : a.short === 0 ? '光靠存粮和菜园，今晚就不够吃了。' : `光靠存粮和菜园，只够吃 ${a.short} 天，之后要靠搜刮。`;
    return t + (a.bare ? `这段时间会有 ${a.bare} 块菜园没合适的种子，空着。` : '');
  }
  const pantryTxt = () => pantryRows().map(r => `${FN(r.k)} ${r.n}（${leftTxt(r)}）`).join('、') + `\n种子：${seedTxt()}`;
  const SEA_N = k => Sim.SEASONS[k].name;
  // 作物在哪几季长得好
  const cropSeasons = k => { const c = Sim.CROPS[k].sea, ok = Sim.SEASON_ORDER.filter(x => c[x] >= 1), half = Sim.SEASON_ORDER.filter(x => c[x] > 0 && c[x] < 1); return `${ok.map(SEA_N).join('、')}${half.length ? `（${half.map(SEA_N).join('、')}减半）` : ''}${Sim.SEASON_ORDER.some(x => c[x] > 1) ? '，盛夏多收一半' : ''}`; };
  // 菜园地块：种着什么、几天能收
  function cropTxt(t) {
    if (!t.crop) return '空着：仓库里没有这一季种得活的种子。';
    const c = Sim.CROPS[t.crop.k], k = Sim.cropK(t.crop.k, S.season), wait = c.grow - (S.day - t.crop.d);
    return `种着${FN(t.crop.k)}，${wait > 0 ? `还要 ${wait} 天才能收` : `每天大约收 ${Math.round(Sim.farmYield(t) * k * 10) / 10} 份`}。${FN(t.crop.k)}长在${cropSeasons(t.crop.k)}，过季就枯了，到时候用仓库里的种子换种别的。`;
  }
  function foodHtml() {
    let h = `<div class="gh">粮食 <span class="dim">每天吃 ${Sim.foodUse(S)} 份，先吃快坏的</span></div>`;
    const fa = Sim.foodAhead(S);
    h += `<div class="${fa.short != null && fa.short < 4 ? 'c-amber' : 'dim'}">${aheadTxt()}</div>`;
    const rows = pantryRows();
    h += rows.length ? rows.map(r => `<div class="gi"><div class="row2"><span>${ic('food')}<span class="c-amber">${FN(r.k)}</span> ×${r.n}</span><span class="${r.left != null && r.left <= 1 ? 'c-red' : 'dim'}">${leftTxt(r)}</span></div></div>`).join('') : '<div class="c-red">一点吃的都没有了。</div>';
    const menu = [...new Set((S.diet || []).flat())];
    if ((S.diet || []).length >= 3 && menu.length === 1) h += `<div class="c-amber">这几天只吃${FN(menu[0])}，连着吃 5 天会有人吃腻了赌气。</div>`;
    h += `<div class="gh">种子 <span class="dim">菜园过季、新开的地要用</span></div>`;
    h += Object.keys(Sim.CROPS).map(k => `<div class="gi"><div class="row2"><span>${ic('bag')}<span class="c-amber">${FN(k)}</span> ×${S.seeds[k] || 0}</span>${S.seeds[k] > 0 ? `<button class="btn" data-eatseed="${k}">煮来吃 +${Sim.SEED_FOOD}</button>` : ''}</div><span class="dim">长在${cropSeasons(k)}；种下 ${Sim.CROPS[k].grow} 天后开始收，收成放 ${Sim.FOODS[k].life} 天。</span></div>`).join('');
    return h;
  }
  function gearHtml() {
    const v = selSurv != null ? Sim.byId(S, selSurv) : null, G = Sim.GEAR;
    let h = `<div class="gh">材料</div><div class="edges">${Object.keys(Sim.RES).map(k => `<span class="btn edge" title="${Sim.RES[k].name}">${ic(k === 'mat' ? 'mat' : k, Sim.RES[k].name)}${Sim.RES[k].name} ${S[k] || 0}</span>`).join('')}</div>` + foodHtml();
    const counts = {};
    for (const k of S.stash) counts[k] = (counts[k] || 0) + 1;
    h += `<div class="gh">装备</div>`;
    if (!S.stash.length) h += `<div class="dim">空的。搜刮有装备的地块（地图上的黄点）能捡到，也可以在据点打造。</div>`;
    for (const [k, n] of Object.entries(counts)) {
      let btn = '';
      if (G[k].use) btn = v && (v.inj > 0 || v.inf) ? `<button class="btn" data-heal="${v.id}">${v.inf ? `给${v.name}治咬伤` : `给${v.name}用`}</button>` : '';
      else if (v) btn = `<button class="btn" data-give="${k}">给${v.name}</button>`;
      h += `<div class="gi"><div class="row2"><span>${ic(k)}<span class="c-amber">${G[k].name}</span>${n > 1 ? ` ×${n}` : ''}</span>${btn}</div><span class="dim">${G[k].desc}</span></div>`;
    }
    const carry = S.surv.filter(u => u.gear);
    if (carry.length) {
      h += `<div class="gh">带在身上</div>`;
      h += carry.map(u => `<div class="gi"><div class="row2"><span>${u.name}：${ic(u.gear)}<span class="c-amber">${G[u.gear].name}</span></span><button class="btn" data-unequip="${u.id}">卸下</button></div></div>`).join('');
    }
    h += `<div class="gh">在据点打造</div>`;
    if (!v) h += `<div class="dim">先在左边选人。打造的人白天在据点敲敲打打，夜里照样守据点。</div>`;
    else for (const k of Object.keys(G).filter(k => G[k].cost && (!G[k].tech || Sim.tech(S, G[k].tech)))) {
      const c = Sim.craftCost(v, k, S), pay = Sim.canPay(S, c), ok = Sim.canDo(S, v, 'craft', null, null, k) && pay, on = v.task.k === 'craft' && v.task.item === k;
      h += `<button class="btn act" data-craft="${k}" ${ok && !on ? '' : 'disabled'}><span>${on ? `${v.name}正在打造` : `打造${G[k].name}`}</span><span class="dim">${Sim.costTxt(c)}</span><small>${!Sim.ready(v) ? `${v.name}现在出不了力` : !pay ? '材料不够' : G[k].desc}</small></button>`;
    }
    return h;
  }

  function nightHtml() {
    const P = PLAN, fr = P.fronts;
    const nFail = fr.filter(f => f.state === 'fail').length, nRisk = fr.filter(f => f.state === 'risk').length;
    const extra = Math.round((P.mult / P.wxK - Sim.HORDE_BASE - P.nest) * 100), nestPct = Math.round(P.nest * 100);
    const allN = S.tiles.filter(t => t.nest && !t.nest.sleep), lost = allN.filter(t => !t.nest.found).length;
    const wxPct = Math.round((P.wxK - 1) * 100);
    const why = [extra > 0 ? `边界和尖叫者 +${extra}%` : '', nestPct ? `尸巢 +${nestPct}%` : '', wxPct ? `天气${wxPct > 0 ? '+' : ''}${wxPct}%` : ''].filter(Boolean).join('，');
    let h = wxBox() + `<div class="dim">边界 ${fr.length} 处，接触面 ${P.edges} 条，尸群约 ${P.lo}–${P.hi}${why ? `（${why}）` : ''}${P.wx ? `，按今晚是${WXN(P.wx)}估算` : ''}。右边数字是 防御 / 冲击。</div>`;
    const bit = S.surv.filter(v => v.inf > 0);
    if (bit.length) h += `<div class="box fail"><span class="c-red">被咬的人：${bit.map(v => `${v.name}（还剩 ${v.inf} 晚）`).join('、')}</span><br><span class="dim">到 0 就会尸变。用急救包（装备分页）或收复医院能治好；懂护理的人留守据点能多拖一晚。</span></div>`;
    if (P.brute) h += `<div class="box fail"><span class="c-red">今晚有巨汉</span><br><span class="dim">街区路障只算一半，被撞垮时损耗翻倍，据点铁门受损也更重。今晚靠人守。</span></div>`;
    if (allN.length) h += `<div class="box fail dim">街区里有 ${allN.length} 个尸巢${lost ? `，${lost === allN.length ? (lost > 1 ? '一个都还没找到' : '还没找到') : `还有 ${lost} 个没找到`}。地块面板写着“丧尸会自己繁殖”的地方，附近就藏着巢` : '，都找到了'}。</div>`;
    if (P.screamers) h += `<div class="box fail dim">${P.screamers} 只尖叫者就在地盘边上，正把尸群往这边引。</div>`;
    h += fr.map(f => `<button class="fr" data-fx="${f.x}" data-fy="${f.y}"><span>${Sim.tname(Sim.tile(S, f.x, f.y))}${f.def.n ? ` <span class="dim">守${f.def.n}</span>` : ''}</span><span class="${STATE_CLS[f.state]}">${f.def.total} / ${f.lo}–${f.hi}</span>${meter(f.def.total, f.lo, f.hi)}</button>`).join('');
    if (!fr.length) h += `<div class="c-good">四周都是自己的地盘，今晚不会受到攻击。</div>`;
    else if (nFail) h += `<div class="c-red">${nFail} 处守不住${nRisk ? `，${nRisk} 处看运气` : ''}。点一行去补人或堆路障。</div>`;
    else if (nRisk) h += `<div class="c-amber">${nRisk} 处看运气。</div>`;
    else h += `<div class="c-good">所有边界都守得住。</div>`;
    return h;
  }

  function wxBox() {
    const F = Sim.forecast(S);
    if (!F) return '';
    const T = F.tonight, N = F.next;
    const says = T.say.map((o, i) => `<button class="say${!T.radio && i === T.pick ? ' sel' : ''}" data-trust="${i}"${T.radio ? ' disabled' : ''} aria-pressed="${!T.radio && i === T.pick}">${ic(o.g)}<span><b>${o.name}</b> <span class="dim">${recTxt(o.rec)}</span><br>「${quote(o)}」</span></button>`).join('');
    const nx = N.radio ? `广播：明晚${WXN(N.g)}。` : N.say[0] ? `${N.say[0].name}随口一提：「${quote(N.say[0], '明晚')}」` : '';
    return `<div class="box wx"><div class="wxl">${ic(F.now)}<span><span class="c-amber">白天：${WXN(F.now)}</span><br>${Sim.WX[F.now].day}${F.flood ? '<br>' + Sim.FLOOD_TXT : ''}</span></div>
      <div class="wxl">${ic(T.g)}<span><span class="c-amber">今晚${T.radio ? `：广播说是${WXN(T.g)}` : `：听${whoSaid(T)}的，按${WXN(T.g)}准备`}</span><br>${Sim.WX[T.g].night}</span></div>
      ${says}
      <div class="wxl">${ic(N.g)}<span class="dim">${nx}</span></div>
      <span class="dim">${T.radio ? '有广播就不用猜了。' : '各人看天的本事不一样，口气硬不代表准。点一个人，今晚就按他说的估算。'}</span></div>`;
  }

  // 研究分页：正在研究的、各分支的科技、手里的关键物品
  function techHtml() {
    const v = selSurv != null ? Sim.byId(S, selSurv) : null, TT = Sim.TECHS, cur = S.tech.cur, IT = Sim.ITEMS;
    const who = S.surv.filter(u => u.task.k === 'study' && Sim.ready(u)), school = Sim.owned(S).some(t => t.t === 'school');
    const rate = who.reduce((a, u) => a + Sim.studyPts(u), 0) * (school ? 1.5 : 1) * (Sim.powered(S) ? 1.5 : 1);
    const bar = (p, n) => `<span class="hp" style="display:inline-block;vertical-align:middle"><i style="width:${Math.round(p / n * 100)}%"></i></span>`;
    const needTxt = k => TT[k].need ? `要用掉一样：${TT[k].need.map(i => `<span class="${(S.items[i] || 0) > 0 ? 'c-good' : ''}">${IT[i].name}${(S.items[i] || 0) > 0 ? `×${S.items[i]}` : ''}</span>`).join(' 或 ')}` : '不用特别的东西';
    let h = `<div class="gh">正在研究 <span class="dim">每天 ${rate % 1 ? rate.toFixed(1) : rate} 点${school ? '（国小的图书室多一半）' : ''}${Sim.powered(S) ? '（发电机开着，再多一半）' : ''}</span></div>`;
    if (cur) {
      const p = S.tech.prog[cur] || 0, T2 = TT[cur], stuck = p >= T2.pts && !Sim.haveNeed(S, cur);
      h += `<div class="box ${stuck ? 'fail' : 'safe'}"><span class="c-amber">${T2.name}</span>　${bar(p, T2.pts)} ${p}/${T2.pts}${rate && !stuck && p < T2.pts ? `　<span class="dim">约 ${Math.ceil((T2.pts - p) / rate)} 天</span>` : ''}<br><span class="dim">${T2.desc}<br>${needTxt(cur)}${stuck ? '。<span class="c-red">进度满了，就差这样东西</span>' : ''}</span></div>`;
    } else h += `<div class="dim">还没定研究哪一项。在下面挑一项。</div>`;
    h += `<div class="dim">${who.length ? `在研究的：${who.map(u => u.name).join('、')}。` : '还没有人在研究。'}研究的人在据点干活，夜里照样守据点；大学生、国中老师研究得快一倍。书、懂行的人也会给进度。</div>`;
    if (Sim.tech(S, 'generator') || Sim.tech(S, 'hydro')) {
      h += `<div class="gh">设施</div>`;
      if (Sim.tech(S, 'generator')) h += `<div class="gi"><div class="row2"><span><span class="c-amber">发电机</span>　${S.gen ? (Sim.powered(S) ? '<span class="c-good">开着</span>' : '<span class="c-red">没化学品，停了</span>') : '<span class="dim">关着</span>'}</span><button class="btn" data-gen="${S.gen ? 0 : 1}">${S.gen ? '关掉' : '打开'}</button></div><span class="dim">开着每天烧 1 化学品（现在 ${S.chem || 0}）：研究快一半，电网、探照灯、水耕架不用化学品；据点会多招一些尸群。</span></div>`;
      if (Sim.tech(S, 'hydro')) h += `<div class="gi"><div class="row2"><span><span class="c-amber">水耕架</span>　${S.racks || 0}/${Sim.RACK_MAX}</span></div><span class="dim">每个每天 1 份青菜，每两个每天 1 化学品${Sim.powered(S) ? '（发电机开着，不用）' : ''}。在据点“打造”里做。</span></div>`;
    }
    if (v) h += `<div class="acts"><button class="btn act" data-study="1" ${Sim.canDo(S, v, 'study') && v.task.k !== 'study' ? '' : 'disabled'}><span>${v.task.k === 'study' ? `${v.name}正在研究` : `派${v.name}去研究`}</span><span class="dim">每天 +${Sim.studyPts(v)}</span></button></div>`;
    for (const br of Sim.BRANCHES) {
      h += `<div class="gh">${br}</div>`;
      for (const k of Object.keys(TT).filter(k => TT[k].br === br)) {
        const T2 = TT[k], p = S.tech.prog[k] || 0, done = Sim.tech(S, k), open = Sim.techOpen(S, k);
        const lock = done ? '' : T2.pre && !Sim.tech(S, T2.pre) ? `要先学会「${TT[T2.pre].name}」` : T2.site && !Sim.owned(S).some(t => t.t === T2.site) ? `要先收复${T[T2.site].name}` : '';
        const right = done ? '<span class="c-good">学会了</span>' : k === cur ? '<span class="c-amber">研究中</span>' : open ? `<button class="btn" data-research="${k}">研究这个</button>` : `<span class="dim">${lock}</span>`;
        h += `<div class="gi"><div class="row2"><span><span class="${done ? 'c-good' : 'c-amber'}">${T2.name}</span>${done ? '' : `　${bar(p, T2.pts)} <span class="dim">${p}/${T2.pts}</span>`}</span>${right}</div><span class="dim">${T2.desc}${done ? '' : `<br>${needTxt(k)}`}</span></div>`;

    const have = Object.keys(IT).filter(k => (S.items[k] || 0) > 0);
    h += `<div class="gh">关键物品 <span class="dim">搜刮、拆除、收复时翻到</span></div>` + (have.length ? `<div class="edges">${have.map(k => `<span class="btn edge">${IT[k].name} ${S.items[k]}</span>`).join('')}</div>` : '<div class="dim">还没有。地块面板会写哪里翻得到。</div>');
    return h;
  }
  function logHtml() {
    const byDay = {};

    return `<div class="log">` + Object.keys(byDay).map(Number).sort((a, b) => b - a).slice(0, 10)

  function renderBar() {
    const fr = PLAN.fronts, nFail = fr.filter(f => f.state === 'fail').length, nRisk = fr.filter(f => f.state === 'risk').length;
    const last = S.log[S.log.length - 1];
    $('bar').innerHTML = `
      <button class="night" id="b-night">${ic('moon')}今晚${S.brute ? ' · <span class="c-red">巨汉</span>' : ''} · 边界 ${fr.length}${nFail ? ` · <span class="c-red">守不住 ${nFail}</span>` : ''}${nRisk ? ` · <span class="c-amber">看运气 ${nRisk}</span>` : ''}${!nFail && !nRisk ? ' · <span class="c-good">都守得住</span>' : ''}</button>
      <button class="ticker" id="b-log" title="打开记事">${last ? last.msg : ''}</button>
      <button class="btn primary" id="end" ${S.over || S.event ? 'disabled' : ''}>结束这一天 ▶</button>`;
    $('b-night').onclick = () => { tab = 'night'; renderSide(); };
    $('b-log').onclick = () => { tab = 'log'; renderSide(); };
    $('end').onclick = endDay;
  }

  function endDay() {
    if (S.over || S.event) return;
    const d = S.day, n = S.log.length;
    const ns = Sim.endDay(S);
    report = { day: d, lines: ns.log.slice(n).filter(l => l.d === d) };
    mode = 'report';
    const f = $('fade'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    $('end').disabled = true;
    setTimeout(() => commit(ns), REDUCED ? 0 : 420);

  // ---------- 对话框 ----------

    }
    if (mode === 'help') return dlg(`<h2>末日楼长</h2>
      <p class="dim">停电第三天，你被推举为这栋老公寓的楼长。电台说救援一个月内会到，前提是你们撑得到那时候。</p>
      <ol class="scroll" style="max-height:330px">
        <li>在左边选一个住户，再点地图上的街区，右边会列出能做的事：搜刮、清理丧尸、收复、拆除、驻守、加固。</li>
        <li>人心：每个人记着对自己有分量的事（旧识被送走、心愿了了、一起撑过尸潮……），再加上吃得好不好、睡不睡得下。名字发绿是振作，白天干活多出一把力；发黄是低落，干活、守夜都差一截，也不肯去端巢；发红是崩溃，夜里可能一走了之。选中住户能看到他心里记着什么。坏事大多会慢慢淡掉。拉人心的办法：在据点办聚餐（花粮食，桌上越杂越好）、派人谈心（陪心情最差的人聊一天，有过节的可能说开），或者你自己找人聊（选中住户点“找他聊聊”，每天一次，话题看他心里最重的事，怎么回由你选）、让人歇一天；收复公园、宫庙，大家平时也会好过一点。兑现牵挂、别把被咬的人送走，也都算数。</li>

        <li>开新局时可以选街区大小：小街区 8×8，节奏快；大街区 12×12，东西多、出路多、巢也多，一局更长。大街区一次只看得到一部分，按住地图拖动，或者点右下角的小地图移过去。</li>

        <li>边界街区守不住就会丢，和据点断开的地块也会一起丢。据点守不住会撞坏铁门，铁门撞开就输了。</li>

        <li>开局先选城里的情况，再选你以前是做什么的。两样都会改变这一局的打法，每次三选一。</li>
        <li>天气：每晚的天气早就定了。每天早上有两三个人说说今晚会是什么天、看到了什么天象（“今晚”分页），各人看天的本事不一样，说话有没有把握跟准不准无关；楼长默认听战绩最好的人，也可以点别人改听他的，夜里的估算就按听的那个来。记事里会记谁说中了，住户卡片的提示里也有战绩。看错的人多半错成相近的天气，瞎猜的人就不一定了。收复电台能听广播，全准；特质“老寒腿”的人看天准，变天时膝盖还会疼。</li>
        <li>天气有 13 种：大雨天搜刮安全、存粮发霉，雷雨和大雨夜尖叫者叫不响，雷还可能劈中街上的楼；回南天存粮发霉得更凶；雾里看不清丧尸；酷暑白天好清理、夜里尸群多；寒流夜尸群少但要烧材料取暖，走了常常下霜，那天菜园没收成。有的天气是一段过程：外围环流之后一定是台风（尸群少、路障掉一层，第二天只能去相邻的街区），台风过后淹水一天（漂来材料、骑不了车）；东北季风刮起来，寒流多半跟着来。今晚的天气会延续到明天白天。</li>
        <li>季节一年七个：初春、春末、梅雨、盛夏、秋老虎、深秋、寒冬，每季 9 天，开局自己选从哪个季节开始。季节决定多半是什么天气，也决定菜园里什么种得活。</li>
        <li>粮食分好几种（“仓库”分页）：罐头不会坏，米粮放 40 天，番薯 25 天、萝卜 14 天、丝瓜 7 天、青菜 4 天，每天先吃快坏的，放过期就扔了。连着 5 天只有同一种东西吃，会有人吃腻了赌气。冬天天冷，吃得多两成。仓库分页最上面（和顶栏食物的提示）会算光靠存粮和菜园能撑几天：菜园要等几天才收、换季后哪几块会因为没种子空着，都算在里面。</li>
        <li>菜园要种子：青菜长在初春、春末、深秋，番薯从春末种到秋老虎，丝瓜盛夏收得最多，萝卜是冬天唯一种得活的。作物过季就枯了，会自动用仓库里的种子换种这一季最好的，种下后一两天才开始收。种子在菜市场、公园、五金行最容易翻到，收成时偶尔也能留下一包；饿急了可以把种子煮来吃，但明年就没得种了。</li>

        <li>地图上张着嘴、带红色声波的是尖叫者：它让周围丧尸长得更快，还会把夜袭引过来，清空那一格就能解决它。第 10 天以后，有些夜里会来巨汉，白天就会预告；那晚街区路障只算一半。</li>
        <li>尸巢藏在街区里，每局 1–3 个，中途还会冒出新的。丧尸只在巢附近繁殖，巢每晚往四周喷丧尸，每一级还让夜里的尸群多 5%，出现后每 10 天长大一级。地块面板写着“丧尸会自己繁殖”，附近三格内就有巢；地盘推到两格以内，或者有人在巢旁边干活，就能找到它（地图上暗红色、会鼓动的肉堆）。找到后离地盘两格以内就能派人直接去端，最好几个人同一天一起上；端掉的巢里常有前人留下的装备。</li>

        <li>住户之间有旧识和过节。有人心里有牵挂（粉色小旗）：救家人、拿东西、收回老家、不准拆某栋楼。达成了他会更卖力，放着不管会出事。</li>
        <li>材料有三种：木料（堆路障、取暖、做木器）、废铁（焊据点的铁窗、打造铁器、铁丝网）、化学品（做急救包、探照灯的燃料）。搜刮和拆楼时按地方分拣：五金行、派出所、超市废铁多，医院、五金行有化学品，住宅、国小多半是木料。五金行收复后每天出 1 废铁。废墟和拆过的楼上能种树，长 20 天（冬天不长）成林，之后每天出 1 木料，也能整片砍掉换 10 木料、从头再长。</li>
        <li>边上的工事：每块地朝外的每条边能造一样东西，派一个人花一天、付材料造好。木栅 +1 防御，铁丝网 +2 而且巨汉撞不开，钉板陷阱先挡掉 3 点、触发后要派人来这块地“加固”重新布置，哨位让站在上面拿弓弩的人也帮相邻的自家地块放箭，探照灯让雾夜的冲击不再说不准，诱饵把尸群往这块地多引一些。诱饵加陷阱加哨位，就是一块杀伤区。</li>
        <li>武器：长矛只要木料，守夜战斗 +1；弓（木料）+2、弩（木料加废铁）+3，每晚每人用掉 1 支箭、天亮捡回一半，没箭就没用。箭在据点做，一次 6 支。</li>
        <li>菜园可以自己选种什么（地块面板里），选了就马上用一包种子换种；选下一季的作物可以提前种下，等换季时正好长好。</li>
        <li>工厂：加油站（抽出化学品）、修车厂（废铁敲成零件，做弩要用）、化工厂（化学品配成火药，压子弹要用），都离据点比较远。收复后要派人驻场才开工；机器开一天掉 1 点耐久，掉到 0 就停，要派人维修；开机会吵，旁边没收复的街区可能多出丧尸。</li>
        <li>枪：手枪（派出所）、霰弹枪（修车厂）、步枪（空投、尸巢里）只能捡，捡到时弹匣里有几发子弹。守夜时手枪 +3、步枪 +4（站哨位能帮相邻地块）、霰弹枪 +5 但一晚用 2 发。子弹打掉就没了，枪声会把附近的丧尸引过来。子弹在据点用火药加废铁压，一次 5 发；派出所的弹药柜里也能翻到。</li>
        <li>装备：每人能带一件，在“装备”分页里分配。撬棍在五金行、对讲机在派出所、急救包在医院和超市，住宅里有脚踏车，废墟里有安全帽（地图上的黄点）；消防斧和安全帽也能花材料在据点打造。受伤时身上的东西可能掉在原地。</li>
        <li>清晨偶尔会有事找上门：街区里的另一伙人（白旗）、收音机里的求救信号（蓝旗）、发烧的住户、烧起来的楼。有些事会接着发展好几天。</li>
      </ol>
      <div class="row"><button class="btn primary" id="d-ok">开始</button></div>`, () => { $('d-ok').onclick = closeDlg; });

      });
    if (mode === 'rules') return dlg(`<h2>楼规</h2>
      <div class="rules scroll" style="max-height:360px">${S.season ? `<div><span class="ln ln-季节 chip">季节</span> <span class="c-amber">${Sim.SEASONS[S.season].name}</span> <span class="dim">${Sim.SEASONS[S.season].desc}（这局从${Sim.SEASONS[S.start].name}开始）</span></div>` : ''}${S.city ? `<div><span class="ln ln-城况 chip">城况</span> <span class="c-amber">${Sim.CITIES[S.city].name}</span> <span class="dim">${Sim.CITIES[S.city].desc}</span></div>` : ''}${S.origin ? `<div><span class="ln ln-出身 chip">出身</span> <span class="c-amber">${Sim.ORIGINS[S.origin].name}</span> <span class="dim">${Sim.ORIGINS[S.origin].desc}</span></div>` : ''}${S.rules.length ? S.rules.map(k => { const r = Sim.RULES[k]; return `<div><span class="ln ln-${r.line} chip">${r.line}</span> <span class="c-amber">${r.name}</span> <span class="dim">${r.desc}</span></div>`; }).join('') : `<p class="dim">还没有楼规。每次换季（每 ${Sim.SEASON_LEN} 天一次）的第一天，会从三张里选一张。</p>`}</div>
      <div class="row"><button class="btn primary" id="d-ok">关闭</button></div>`, () => { $('d-ok').onclick = closeDlg; });
    if (S.event && Sim.eventView(S).draft) {
      const ev = Sim.eventView(S);
      return dlg(`<h2>${ic('sun')}${ev.title || '定一条楼规'}</h2><p class="dim">${ev.text}</p>
        <div class="cards${ev.choices.length > 3 ? ' four' : ''}">${ev.choices.map((c, i) => `<button class="btn card" data-c="${i}" ${c.ok === false ? 'disabled' : ''}><span class="ln ln-${c.line}">${c.line}</span>${SEASON_IC[c.key] ? ic(SEASON_IC[c.key]) : ''}<b>${c.label}</b><span class="d">${c.note}</span></button>`).join('')}</div>`,
        () => $('dlg').querySelectorAll('[data-c]').forEach(b => b.onclick = () => commit(Sim.resolveEvent(S, +b.dataset.c))));
    }
    if (S.event) {
      const ev = Sim.eventView(S);
      return dlg(`<h2>${ic('sun')}${ev.title || `第 ${S.day} 天 · 清晨`}</h2><p>${ev.text}</p><div class="choices">${ev.choices.map((c, i) =>
        `<button class="btn" data-c="${i}" ${c.ok ? '' : 'disabled'}>${c.label}${c.note ? `<small>${c.note}${c.ok ? '' : '（条件不够）'}</small>` : ''}</button>`).join('')}</div>`,
        () => $('dlg').querySelectorAll('[data-c]').forEach(b => b.onclick = () => commit(Sim.resolveEvent(S, +b.dataset.c))));
    }
    if (S.over && !overSeen) {
      const o = S.over;
      return dlg(`<h2>${o.win ? `${ic('heli')}撑到了` : `${ic('skull')}失守`}</h2><p>${o.reason}</p>
        <div class="row"><span class="big">${o.score}</span><span class="dim">分 · 活下来 ${S.surv.length} 人 · 收复 ${Sim.owned(S).length} 块 · 失去 ${S.stats.lost} 人 · 清掉 ${S.stats.killed} 只</span></div>
        ${o.win ? `<p><span class="c-amber">${ENDING[o.ending] || ''}</span>　<span class="dim">这条街还有别的出路。</span></p>` : ''}
        <div class="row"><button class="btn primary" id="d-again">再来一局</button><button class="btn" id="d-look">看看地图</button></div>`,
        () => { $('d-again').onclick = () => { mode = 'new'; renderOverlay(); }; $('d-look').onclick = () => { overSeen = true; closeDlg(); }; });
    }
    $('ov').hidden = true;
  }

  const ENDING = { rescue: '结局：得救', safe: '结局：安全区', self: '结局：村子' };
  function newGame(size) {
    const ns = Sim.newGame(undefined, { size });
    selSurv = null; selTile = { x: ns.base[0], y: ns.base[1] }; camSel = ''; mode = null; tab = 'tile'; overSeen = false; report = null;
    S = ns; centerOn(...ns.base); commit(ns);
  }

  // ---------- 缩放 ----------
  let rotateSkipped = false;
  function fit() {
    const f = $('fit'); f.style.padding = '';   // 先按带留白的尺寸量
    const cs = getComputedStyle(f);
    const aw = f.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = f.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let sc = Math.min(aw / 964, ah / 544), edge = 2;
    // 像素画只有整数倍才清楚：去掉留白和外框能凑到整数倍（比如全屏的 1080p 正好 2 倍）就去掉
    const whole = Math.floor(Math.min(innerWidth / 960, innerHeight / 540));
    if (whole >= 2 && whole > sc) { sc = whole; edge = 0; }
    else if (sc >= 2) sc = Math.floor(sc);
    f.style.padding = edge ? '' : '0';
    $('stage').style.transform = `translate(${edge * sc}px,${edge * sc}px) scale(${sc})`;
    $('scaler').style.width = (960 + 2 * edge) * sc + 'px'; $('scaler').style.height = (540 + 2 * edge) * sc + 'px';
    $('rotate').hidden = rotateSkipped || !(innerHeight > innerWidth && innerWidth < 600);
  }
  addEventListener('resize', fit);
  $('rotate-skip').onclick = () => { rotateSkipped = true; fit(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ['help', 'save', 'new', 'rules'].includes(mode)) closeDlg(); });

  S = load() || Sim.newGame();
  selTile = { x: S.base[0], y: S.base[1] }; centerOn(...S.base);
  if (S.day === 1 && !S.log.some(l => l.d > 1)) mode = 'help';
  fit(); render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); render(); });
})();
</script>
