    tip.style.left = Math.max(0, Math.min(384 - tip.offsetWidth, p.x * 48 + 24 - tip.offsetWidth / 2)) + 'px';
    tip.style.top = (p.y === 0 ? 50 : p.y * 48 - 20) + 'px';
  });
  cv.addEventListener('mouseleave', () => { $('tip').hidden = true; hover = null; drawMap(); });
  cv.addEventListener('keydown', e => {
    const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!d) return;
    e.preventDefault();
    selTile = { x: Math.max(0, Math.min(Sim.W - 1, selTile.x + d[0])), y: Math.max(0, Math.min(Sim.H - 1, selTile.y + d[1])) };
    tab = 'tile'; render();
  });

  // ---------- 文本工具 ----------
  const pct = p => Math.round(p * 100) + '%';
  const riskCls = p => p >= 0.3 ? 'c-red' : p >= 0.12 ? 'c-amber' : 'c-good';
  const where = (x, y) => Sim.tname(Sim.tile(S, x, y));
  const LABEL = { craft: '打造', scav: '搜刮', clear: '清理', claim: '收复', strip: '拆除', defend: '驻守', fortify: '加固', rescue: '救人' };
  const daysLeft = w => w.until - S.day;
  function taskText(v) {
    if (v.inf === -1) return { t: '被咬 · 撑不过今天了', hurt: true };
    if (v.inf > 0) return { t: `被咬 · 还剩 ${v.inf} 晚${v.inj > 0 ? ' · 休养中' : ''}`, hurt: true };
    if (v.inj > 0) return { t: `受伤 · 休养 ${v.inj} 天`, hurt: true };
    if (v.sulk > 0) return { t: '在房里赌气', hurt: true };
    if (v.busy) return { t: '今天在外面忙', hurt: true };
    const k = v.task.k, at = v.task.x != null;
    if (k === 'defend') return { t: at ? `驻守 ${where(v.task.x, v.task.y)}` : '留守据点' };
    if (k === 'fortify') return { t: at ? `堆路障 ${where(v.task.x, v.task.y)}` : '加固据点' };
    if (k === 'craft') return { t: `在据点打造${Sim.GEAR[v.task.item].name}` };
    return { t: `${LABEL[k]} ${where(v.task.x, v.task.y)}` };
  }
  const relOf = id => S.rel.filter(r => r[0] === id || r[1] === id).map(r => {
    const o = Sim.byId(S, r[0] === id ? r[1] : r[0]);
    return o ? `<span class="${r[2] === 'friend' ? 'c-good' : 'c-red'}">${r[2] === 'friend' ? '旧识' : '过节'}${o.name}</span>` : '';
  }).filter(Boolean).join(' ');

  // ---------- 渲染 ----------
  function render() {
    PLAN = Sim.nightPlan(S);
    if (selSurv != null && !Sim.byId(S, selSurv)) selSurv = null;
    drawMap(); renderHud(); renderPeople(); renderCap(); renderSide(); renderBar(); renderOverlay();
  }

  function renderHud() {
    const inc = Sim.income(S), net = inc.food - Sim.foodUse(S), beds = Sim.beds(S);
    const left = S.rescueDay ? S.rescueDay - S.day : Sim.GOAL - S.day + 1;
    const surge = Sim.surgeIn(S), pa = Sim.arrivalChance(S);
    $('hud').innerHTML = `
      <span class="res">${ic('sun')} 第 ${Math.min(S.day, Sim.GOAL)}<small>/${Sim.GOAL}天</small></span>
      <span class="res" title="食物：库存 / 每天净变化">${ic('food', '食物')}<span class="${S.food + net < 0 ? 'c-red' : ''}">${S.food}</span><small class="${net < 0 ? 'c-amber' : ''}">${net >= 0 ? '+' : ''}${net}</small></span>
      <span class="res" title="材料">${ic('mat', '材料')}${S.mat}${inc.mat ? `<small>+${inc.mat}</small>` : ''}</span>
      <span class="res" title="住户 / 床位">${ic('bed', '床位')}${S.surv.length}<small>/${beds}</small></span>
      <span class="res" title="铁门耐久">${ic('gate', '铁门')}<span class="hp${S.wall <= 4 ? ' low' : ''}"><i style="width:${Math.max(0, S.wall / S.wallMax * 100)}%"></i></span><small>${S.wall}</small></span>
      <span class="spacer"></span>
      ${pa > 0 ? `<span class="res c-kin" title="明早有人来投奔的机会">投奔${Math.round(pa * 100)}%</span>` : ''}
      ${S.brute ? `<span class="res c-red" title="今晚的尸群里有巨汉：街区路障只算一半，被撞时损耗翻倍，铁门受损更重">${ic('fist', '巨汉')}今晚巨汉</span>` : ''}
      <span class="res ${surge === 0 ? 'c-red' : ''}">${ic('skull', '尸潮')}${surge === 0 ? '今晚尸潮' : `尸潮${surge}天`}</span>
      <span class="res">${ic('heli', '救援')}${S.rescueDay ? '直升机' : '救援'}${left}天</span>
      <span class="menu"><button class="btn" id="b-rules">楼规${S.rules.length}</button><button class="btn" id="b-help">说明</button><button class="btn" id="b-save">存档</button><button class="btn" id="b-new">新局</button></span>`;
    $('b-help').onclick = () => { mode = 'help'; renderOverlay(); };
    $('b-rules').onclick = () => { mode = 'rules'; renderOverlay(); };
    $('b-save').onclick = () => { mode = 'save'; renderOverlay(); };
    $('b-new').onclick = () => { mode = 'new'; renderOverlay(); };
  }

  function renderPeople() {
    $('pcount').textContent = `${S.surv.length} 人`;
    const box = $('people'), top = box.scrollTop;
    box.innerHTML = S.surv.map(v => {
      const tt = taskText(v), out = !Sim.ready(v);
      const T2 = Sim.TRAITS[v.trait];
      return `<button class="pc${v.id === selSurv ? ' sel' : ''}${out ? ' out' : ''}" data-id="${v.id}" aria-pressed="${v.id === selSurv}" title="${v.job} · ${T2 ? T2.name + '：' + T2.desc : ''}${v.gear ? ' · 带着' + Sim.GEAR[v.gear].name : ''}">
        <canvas width="12" height="12" data-pid="${v.id}"></canvas>
        <span class="nm"><b>${v.name}</b>${T2 ? `<span class="trait">${T2.name}</span>` : `<span>${v.job}</span>`}</span>
        <span class="sk">${ic('fist', '战斗')}<em>${v.fight}</em>${ic('bag', '搜刮')}<em>${v.scav}</em>${ic('ham', '建造')}<em>${v.build}</em><span class="job">${v.job}</span></span>
        <span class="tk${tt.hurt ? ' hurt' : ''}">${tt.t}</span>
        ${v.want ? `<span class="kin" title="${v.want.txt}">${ic('flag', '牵挂')}</span>` : ''}
        ${v.gear ? `<span class="gear" title="${Sim.GEAR[v.gear].name}：${Sim.GEAR[v.gear].desc}">${ic(v.gear, Sim.GEAR[v.gear].name)}</span>` : ''}
      </button>`;
    }).join('') || '<p class="dim">楼里已经没有人了。</p>';
    box.scrollTop = top;
    box.querySelectorAll('canvas[data-pid]').forEach(c => portrait(c, Sim.byId(S, +c.dataset.pid)));
    box.querySelectorAll('.pc').forEach(el => el.onclick = () => {
      const id = +el.dataset.id;
      selSurv = selSurv === id ? null : id;
      const v = Sim.byId(S, id);
      if (selSurv != null && v.task.x != null) selTile = { x: v.task.x, y: v.task.y };
      tab = 'tile'; render();
    });
  }

  function renderCap() {
    const v = selSurv != null ? Sim.byId(S, selSurv) : null;
    if (!v) { $('mapcap').innerHTML = `<span>先在左边选人，再点地块派工。</span><span>悬停地块看名字，方向键也能移动。</span>`; return; }
    const T2 = Sim.TRAITS[v.trait], rel = relOf(v.id);
    $('mapcap').innerHTML = `<span>派 <span class="c-amber">${v.name}</span>（${v.job}）去哪？点地块。${rel ? ' ' + rel : ''}</span>
      <span>${v.gear ? `${ic(v.gear)}<span class="c-amber">${Sim.GEAR[v.gear].name}</span> · ` : ''}${T2 ? `<span style="color:#d6b98a">${T2.name}</span>：${T2.desc}` : ''}</span>`;
  }

  // ---------- 右侧面板 ----------
  const TASKS = {
    rescue: ['救人', '把被困的人接回来'],
    defend: ['驻守', '夜里守在这里'],
    fortify: ['加固', '耗 2 材料'],
    scav: ['搜刮', '带回食物和材料'],
    clear: ['清理丧尸', '清干净才能收复或拆除'],
    claim: ['收复', '封窗、清路、接水电'],
    strip: ['拆除', '换成材料'],
  };
  const STATE_TXT = { safe: '守得住', risk: '看运气', fail: '守不住' };
  const STATE_CLS = { safe: 'c-good', risk: 'c-amber', fail: 'c-red' };
  const WANT_HOW = { rescue: '派人来救人，谁去都行。', fetch: '来这里搜刮就能顺手找到。', reclaim: '收复这里就算达成。', protect: '期限内别拆这里就行。' };
  function relevant(t, x, y, k) {
    const base = isBaseT(t);
    if (k === 'defend') return t.owned;
    if (k === 'fortify') return t.owned && (base || t.bar < Sim.barMax(S));
    if (k === 'strip') return !base && t.strip > 0 && t.z === 0 && !t.nest;   // 没找到的巢那格总有丧尸，本来就拆不了
    if (k === 'scav') return t.food + t.mat > 0 || t.gear.length > 0;
    if (k === 'clear') return !t.owned && (t.nest && t.nest.found ? Sim.nestReach(S, x, y) : t.z > 0 && Sim.frontier(S, x, y));
    if (k === 'claim') return !t.owned && t.z === 0 && !t.nest && Sim.frontier(S, x, y);
    if (k === 'rescue') return (S.sos && S.sos.x === x && S.sos.y === y) || S.surv.some(u => u.want && u.want.k === 'rescue' && u.want.x === x && u.want.y === y);
  }
  const onTile = (v, x, y) => isBaseT(Sim.tile(S, x, y)) ? (v.task.x == null || (v.task.x === x && v.task.y === y)) : (v.task.x === x && v.task.y === y);

  function renderSide() {
    $('tabs').querySelectorAll('button').forEach(b => { b.setAttribute('aria-selected', b.dataset.tab === tab); b.onclick = () => { tab = b.dataset.tab; renderSide(); }; });
    const nFail = PLAN.fronts.filter(f => f.state === 'fail').length;
    $('tabs').querySelector('[data-tab="night"]').innerHTML = `今晚${nFail ? ` <span class="c-red">!${nFail}</span>` : ''}`;
    const body = $('sidebody');
    body.innerHTML = tab === 'tile' ? tileHtml() : tab === 'night' ? nightHtml() : tab === 'gear' ? gearHtml() : logHtml();
    body.scrollTop = 0;
    body.querySelectorAll('[data-task]').forEach(b => b.onclick = () => commit(Sim.setTask(S, selSurv, { k: b.dataset.task, x: selTile.x, y: selTile.y })));
    body.querySelectorAll('[data-recall]').forEach(b => b.onclick = () => commit(Sim.setTask(S, +b.dataset.recall, { k: 'defend' })));
    body.querySelectorAll('[data-give]').forEach(b => b.onclick = () => commit(Sim.equip(S, selSurv, b.dataset.give)));
    body.querySelectorAll('[data-unequip]').forEach(b => b.onclick = () => commit(Sim.equip(S, +b.dataset.unequip, null)));
    body.querySelectorAll('[data-heal]').forEach(b => b.onclick = () => commit(Sim.useMedkit(S, +b.dataset.heal)));
    body.querySelectorAll('[data-craft]').forEach(b => b.onclick = () => commit(Sim.setTask(S, selSurv, { k: 'craft', item: b.dataset.craft })));
    body.querySelectorAll('[data-fx]').forEach(b => b.onclick = () => { selTile = { x: +b.dataset.fx, y: +b.dataset.fy }; tab = 'tile'; render(); });
  }

  const meter = (def, lo, hi) => { const max = Math.max(hi, def) + 2; return `<span class="bar2"><span class="d" style="width:${def / max * 100}%"></span><span class="t" style="left:${lo / max * 100}%;width:${Math.max(1, hi - lo) / max * 100}%"></span></span>`; };

  function tileHtml() {
    const { x, y } = selTile, t = Sim.tile(S, x, y), ty = T[t.t], base = isBaseT(t), reach = Sim.reachable(S, x, y);
    let chip;
    if (!t.seen) chip = '<span class="chip dim">未探明</span>';
    else if (base) chip = '<span class="chip c-amber">据点</span>';
    else if (t.owned) chip = '<span class="chip c-amber">我方</span>';
    else if (t.z > 0) chip = `<span class="chip c-z">丧尸 ${t.z}</span>`;
    else chip = '<span class="chip c-good">暂时安全</span>';
    if (t.scream) chip += '<span class="chip c-red">尖叫者</span>';
    const nest = t.nest && t.nest.found ? t.nest : null;
    if (nest) chip += `<span class="chip c-red">${nest.lv} 级尸巢</span>`;
    if (t.drop) chip += '<span class="chip c-good">空投</span>';
    let h = `<div class="th"><b>${Sim.tname(t)}</b>${chip}<span class="dim">${x + 1},${y + 1}</span></div>
      <div class="desc">${t.gutted ? '拆了一部分，原本的用处没了。' : t.t === 'radio' && S.city === 'noradio' ? '电塔倒了，这里修好了也叫不来救援。' : ty.desc}${!t.owned && t.prog ? ` 施工 ${t.prog}/${ty.cost}。` : ''}</div>`;
    if (t.scream) h += `<div class="box fail"><span class="c-red">尖叫者</span><br><span class="dim">它让这里和四周的丧尸长得更快，夜里会把尸群引向它那一侧。把这一格清空就能解决它。</span></div>`;
    if (t.seen && !t.owned && !nest && Sim.nestHint(S, x, y)) h += `<div class="box fail dim">这一带的丧尸会自己繁殖，附近三格以内藏着一个没找到的尸巢。多看几块地，范围就能缩小。</div>`;
    if (nest) {
      const n = nest, max = Sim.nestHp(n.lv), nextLv = n.lv < 3 ? n.born + 10 * n.lv : 0;
      h += `<div class="box fail"><span class="c-red">尸巢 · ${n.lv} 级 · 巢还剩 ${n.hp}/${max}</span><br><span class="dim">每晚往两格内喷丧尸，还让整个街区的尸群 +${Math.round(Sim.NEST_HORDE * n.lv * 100)}%；离巢 ${Sim.NEST_R} 格以内的丧尸会自己繁殖。${nextLv && S.day < nextLv ? `第 ${nextLv} 天会长大一级。` : ''}<br>端巢：派人来清理，先砍游荡的丧尸（这一格最多 ${Sim.nestZ(n.lv)} 只），多出来的力气才砍得到巢。巢每晚长回 1 点，最好几个人同一天一起上。离地盘两格以内就能直接杀过去，不用先打通路，但这些人今晚不在家。</span></div>`;
    }
    if (t.seen && !base) h += `<div class="kv">${ic('food')}${t.food}　${ic('mat')}${t.mat}${t.strip > 0 ? `　<span class="dim">可拆 ${t.strip}</span>` : ''}</div>`;
    if (t.seen && t.gear.length) h += `<div class="box kin dim">地上有：${t.gear.map(k => `${ic(k)}<span class="c-amber">${Sim.GEAR[k].name}</span>`).join('、')}。搜刮、拆除或收复这里就能带回去。</div>`;
    if (t.camp) {
      const hostile = S.camp && S.camp.state === 'hostile';
      h += `<div class="box ${hostile ? 'fail' : 'kin'}"><span class="${hostile ? 'c-red' : 'c-kin'}">${hostile ? '结了仇的那伙人' : '另一伙幸存者'}</span><br><span class="dim">${hostile ? '你们抢过他们，他们迟早会找上门。' : '这里是他们的地盘，不能搜刮、清理或收复。他们在的时候，替你挡住了这一侧的尸群。'}</span></div>`;
    }
    if (S.sos && S.sos.x === x && S.sos.y === y) {
      const d = S.sos.until - S.day;
      h += `<div class="box kin"><span style="color:#74a6dc">求救信号：${S.sos.n} 个人困在这里</span><br><span class="dim">${d <= 0 ? '今晚是最后期限。' : `还剩 ${d} 天。`}派人来救人就能接回来。${S.sos.promised ? '你答应过他们。' : ''}${reach ? '' : '先把地盘推过来。'}</span></div>`;
    }
    for (const u of S.surv.filter(u => u.want && u.want.x === x && u.want.y === y)) {
      const d = daysLeft(u.want);
      h += `<div class="box kin"><span class="c-kin">${ic('flag')} ${u.name}：${u.want.txt}</span><br><span class="dim">${d <= 0 ? '今晚是最后期限。' : `还剩 ${d} 天。`}${WANT_HOW[u.want.k]}${reach ? '' : '先把地盘推过来。'}</span></div>`;
    }
    if (t.owned) {
      const f = PLAN.fronts.find(f => f.x === x && f.y === y);
      if (f) {
        const d = f.def;
        h += `<div class="box ${f.state}">${ic('moon')} 今晚冲击 ${f.lo}–${f.hi}，防御 ${d.total}，<span class="${STATE_CLS[f.state]}">${STATE_TXT[f.state]}</span>
          <div style="margin:3px 0">${meter(d.total, f.lo, f.hi)}</div>
          <span class="dim">${base ? '工事' : '路障'} ${d.barRaw !== d.bar ? `${d.barRaw}→<span class="c-red">${d.bar}</span>（巨汉）` : d.bar}${base ? '' : '/' + Sim.barMax(S)} · 建筑 ${d.place} · 驻守 ${d.n} 人 +${d.people}</span></div>`;
      } else h += `<div class="box safe dim">${ic('moon')} 在地盘内侧，今晚安全。</div>`;
    }
    const v = selSurv != null ? Sim.byId(S, selSurv) : null;
    const byBike = !reach && v && t.seen && Sim.bikeReach(S, v, x, y);
    const byRaid = !reach && t.seen && Sim.nestReach(S, x, y);
    if (t.seen && nest && !reach && !byRaid) return h + `<div class="dim">离地盘太远。地盘推到离这里两格以内，就能派人直接来端巢。</div>`;
    if (!t.seen || (!reach && !byBike && !byRaid)) return h + `<div class="dim">离地盘太远。先收复相邻的街区${S.surv.some(u => u.gear === 'bike') ? '，或者让骑脚踏车的人去' : ''}。</div>`;
    if (t.camp) return h;
    if (byBike) h += `<div class="dim">${v.name}骑脚踏车能到这里。</div>`;
    const keys = (t.owned ? ['rescue', 'defend', 'fortify', 'scav', 'strip'] : ['rescue', 'scav', 'clear', 'claim', 'strip'])
      .filter(k => relevant(t, x, y, k) && (reach || byBike || k === 'clear'));
    if (!keys.length) return h + `<div class="dim">这里没什么可做的。</div>`;
    if (!v) h += `<div class="c-amber">在左边选一个住户来派工。</div>`;
    h += `<div class="acts">` + keys.map(k => {
      let [name, note] = TASKS[k];
      if (k === 'fortify') { name = base ? '加固工事' : '堆路障'; note = base ? '工事+1~2，修铁门，耗 2 材料' : `路障 ${t.bar}/${Sim.barMax(S)}，+1~2，耗 2 材料`; }
      if (k === 'defend' && base) name = '留守';
      if (k === 'clear' && nest) { name = '端巢'; note = '几个人同一天一起上'; }
      if (k === 'strip') note = S.surv.some(u => u.want && u.want.k === 'protect' && u.want.x === x && u.want.y === y) ? '有人不准拆，拆了会结仇' : (t.owned ? '换材料，加成立刻没了' : '一次拿走大量材料');
      const ok = v && Sim.canDo(S, v, k, x, y);
      const already = v && v.task.k === k && onTile(v, x, y);
      let sub = note, risk = '';
      if (ok) {
        const p = Sim.preview(S, v, k, x, y);
        sub = p.gain || note;
        if (k === 'scav' || k === 'clear' || k === 'rescue') risk = `<span class="${riskCls(p.risk)}">伤${pct(p.risk)}</span>`;
      }
      const label = v && already ? `${v.name}正在${name}` : name;
      return `<button class="btn act" data-task="${k}" ${ok && !already ? '' : 'disabled'}><span>${label}</span><span>${risk}</span><small>${v && !Sim.ready(v) ? `${v.name}现在出不了门` : sub}</small></button>`;
    }).join('') + `</div>`;
    const here = S.surv.filter(u => Sim.ready(u) && onTile(u, x, y) && !(base && u.task.x == null && u.task.k === 'defend'));
    if (here.length) h += `<div class="here dim">在这里：${here.map(u => `${u.name}·${LABEL[u.task.k]} <button data-recall="${u.id}">叫回</button>`).join('，')}</div>`;
    return h;
  }

  function gearHtml() {
    const v = selSurv != null ? Sim.byId(S, selSurv) : null, G = Sim.GEAR;
    let h = '';
    const counts = {};
    for (const k of S.stash) counts[k] = (counts[k] || 0) + 1;
    h += `<div class="gh">仓库</div>`;
    if (!S.stash.length) h += `<div class="dim">空的。搜刮有装备的地块（地图上的黄点）能捡到，也可以在据点打造。</div>`;
    for (const [k, n] of Object.entries(counts)) {
      let btn = '';
      if (G[k].use) btn = v && (v.inj > 0 || v.inf) ? `<button class="btn" data-heal="${v.id}">${v.inf ? `给${v.name}治咬伤` : `给${v.name}用`}</button>` : '';
      else if (v) btn = `<button class="btn" data-give="${k}">给${v.name}</button>`;
      h += `<div class="gi"><div class="row2"><span>${ic(k)}<span class="c-amber">${G[k].name}</span>${n > 1 ? ` ×${n}` : ''}</span>${btn}</div><span class="dim">${G[k].desc}</span></div>`;
    }
    const carry = S.surv.filter(u => u.gear);
    if (carry.length) {
      h += `<div class="gh">带在身上</div>`;
      h += carry.map(u => `<div class="gi"><div class="row2"><span>${u.name}：${ic(u.gear)}<span class="c-amber">${G[u.gear].name}</span></span><button class="btn" data-unequip="${u.id}">卸下</button></div></div>`).join('');
    }
    h += `<div class="gh">在据点打造</div>`;
    if (!v) h += `<div class="dim">先在左边选人。打造的人白天在据点敲敲打打，夜里照样守据点。</div>`;
    else for (const k of Object.keys(G).filter(k => G[k].cost)) {
      const c = Sim.craftCost(v, k), ok = Sim.canDo(S, v, 'craft', null, null, k) && S.mat >= c, on = v.task.k === 'craft' && v.task.item === k;
      h += `<button class="btn act" data-craft="${k}" ${ok && !on ? '' : 'disabled'}><span>${on ? `${v.name}正在打造` : `打造${G[k].name}`}</span><span>${ic('mat')}${c}</span><small>${!Sim.ready(v) ? `${v.name}现在出不了力` : S.mat < c ? '材料不够' : G[k].desc}</small></button>`;
    }
    return h;
  }

  function nightHtml() {
    const P = PLAN, fr = P.fronts;
    const nFail = fr.filter(f => f.state === 'fail').length, nRisk = fr.filter(f => f.state === 'risk').length;
    const extra = Math.round((P.mult - Sim.HORDE_BASE - P.nest) * 100), nestPct = Math.round(P.nest * 100);
    const allN = S.tiles.filter(t => t.nest), lost = allN.filter(t => !t.nest.found).length;
    const why = [extra > 0 ? `边界和尖叫者 +${extra}%` : '', nestPct ? `尸巢 +${nestPct}%` : ''].filter(Boolean).join('，');
    let h = `<div class="dim">边界 ${fr.length} 处，接触面 ${P.edges} 条，尸群约 ${P.lo}–${P.hi}${why ? `（${why}）` : ''}。右边数字是 防御 / 冲击。</div>`;
    const bit = S.surv.filter(v => v.inf > 0);
    if (bit.length) h += `<div class="box fail"><span class="c-red">被咬的人：${bit.map(v => `${v.name}（还剩 ${v.inf} 晚）`).join('、')}</span><br><span class="dim">到 0 就会尸变。用急救包（装备分页）或收复医院能治好；懂护理的人留守据点能多拖一晚。</span></div>`;
    if (P.brute) h += `<div class="box fail"><span class="c-red">今晚有巨汉</span><br><span class="dim">街区路障只算一半，被撞垮时损耗翻倍，据点铁门受损也更重。今晚靠人守。</span></div>`;
    if (allN.length) h += `<div class="box fail dim">街区里有 ${allN.length} 个尸巢${lost ? `，${lost === allN.length ? (lost > 1 ? '一个都还没找到' : '还没找到') : `还有 ${lost} 个没找到`}。地块面板写着“丧尸会自己繁殖”的地方，附近就藏着巢` : '，都找到了'}。</div>`;
    if (P.screamers) h += `<div class="box fail dim">${P.screamers} 只尖叫者就在地盘边上，正把尸群往这边引。</div>`;
    h += fr.map(f => `<button class="fr" data-fx="${f.x}" data-fy="${f.y}"><span>${Sim.tname(Sim.tile(S, f.x, f.y))}${f.def.n ? ` <span class="dim">守${f.def.n}</span>` : ''}</span><span class="${STATE_CLS[f.state]}">${f.def.total} / ${f.lo}–${f.hi}</span>${meter(f.def.total, f.lo, f.hi)}</button>`).join('');
    if (!fr.length) h += `<div class="c-good">四周都是自己的地盘，今晚不会受到攻击。</div>`;
    else if (nFail) h += `<div class="c-red">${nFail} 处守不住${nRisk ? `，${nRisk} 处看运气` : ''}。点一行去补人或堆路障。</div>`;
    else if (nRisk) h += `<div class="c-amber">${nRisk} 处看运气。</div>`;
    else h += `<div class="c-good">所有边界都守得住。</div>`;
    return h;
  }

  function logHtml() {
    const byDay = {};
    for (const l of S.log) (byDay[l.d] = byDay[l.d] || []).push(l);
    return `<div class="log">` + Object.keys(byDay).map(Number).sort((a, b) => b - a).slice(0, 10)
      .map(d => `<h4>第 ${d} 天</h4>${byDay[d].map(l => `<p class="${l.tone}">${l.msg}</p>`).join('')}`).join('') + `</div>`;
  }

  function renderBar() {
    const fr = PLAN.fronts, nFail = fr.filter(f => f.state === 'fail').length, nRisk = fr.filter(f => f.state === 'risk').length;
    const last = S.log[S.log.length - 1];
    $('bar').innerHTML = `
      <button class="night" id="b-night">${ic('moon')}今晚${S.brute ? ' · <span class="c-red">巨汉</span>' : ''} · 边界 ${fr.length}${nFail ? ` · <span class="c-red">守不住 ${nFail}</span>` : ''}${nRisk ? ` · <span class="c-amber">看运气 ${nRisk}</span>` : ''}${!nFail && !nRisk ? ' · <span class="c-good">都守得住</span>' : ''}</button>
      <button class="ticker" id="b-log" title="打开记事">${last ? last.msg : ''}</button>
      <button class="btn primary" id="end" ${S.over || S.event ? 'disabled' : ''}>结束这一天 ▶</button>`;
    $('b-night').onclick = () => { tab = 'night'; renderSide(); };
    $('b-log').onclick = () => { tab = 'log'; renderSide(); };
    $('end').onclick = endDay;
  }

  function endDay() {
    if (S.over || S.event) return;
    const d = S.day, n = S.log.length;
    const ns = Sim.endDay(S);
    report = { day: d, lines: ns.log.slice(n).filter(l => l.d === d) };
    mode = 'report';
    const f = $('fade'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    $('end').disabled = true;
    setTimeout(() => commit(ns), REDUCED ? 0 : 420);
  }

  // ---------- 对话框 ----------
  function dlg(html, bind) { $('dlg').innerHTML = html; $('ov').hidden = false; bind && bind(); const b = $('dlg').querySelector('button:not([disabled])'); if (b) b.focus({ preventScroll: true }); }
  function closeDlg() { mode = null; render(); }

  function renderOverlay() {
    if (mode === 'report' && report) {
      return dlg(`<h2>${ic('moon')}第 ${report.day} 夜</h2>
        <div class="lines scroll">${report.lines.map(l => `<p class="${l.tone}">${l.msg}</p>`).join('') || '<p class="dim">一夜无事。</p>'}</div>
        <div class="row"><button class="btn primary" id="d-ok">${S.over ? '……' : '天亮了'}</button></div>`,
        () => { $('d-ok').onclick = () => { report = null; closeDlg(); }; });
    }
    if (mode === 'help') return dlg(`<h2>末日楼长</h2>
      <p class="dim">停电第三天，你被推举为这栋老公寓的楼长。电台说救援一个月内会到，前提是你们撑得到那时候。</p>
      <ol class="scroll" style="max-height:330px">
        <li>在左边选一个住户，再点地图上的街区，右边会列出能做的事：搜刮、清理丧尸、收复、拆除、驻守、加固。</li>
        <li>夜里尸群会从每块和未收复街区接壤的地盘进攻，边界越长来得越多，地图边缘不会来丧尸。底栏和“今晚”分页会提前标出守不住的地方，地图上会闪红。</li>
        <li>边界街区守不住就会丢，和据点断开的地块也会一起丢。据点守不住会撞坏铁门，铁门撞开就输了。</li>
        <li>清干净的街区可以花几天收复，长期提供床位、食物或防御；也可以拆掉，一次换一大笔材料。</li>
        <li>开局先选城里的情况，再选你以前是做什么的。两样都会改变这一局的打法，每次三选一。</li>
        <li>存粮够、还有空床，会有人来投奔。通常每 7 天一次尸潮。撑过第 30 夜，或者收复电台叫来救援，就算赢。</li>
        <li>每个住户都有一个特质（名字旁边的字），鼠标停在卡片上能看说明。每次撑过尸潮，第二天早上从三张楼规里选一张，效果持续到这局结束；不同的楼规会把你推向不同的打法。</li>
        <li>地图上张着嘴、带红色声波的是尖叫者：它让周围丧尸长得更快，还会把夜袭引过来，清空那一格就能解决它。第 10 天以后，有些夜里会来巨汉，白天就会预告；那晚街区路障只算一半。</li>
        <li>尸巢藏在街区里，每局 1–3 个，中途还会冒出新的。丧尸只在巢附近繁殖，巢每晚往四周喷丧尸，每一级还让夜里的尸群多 5%，出现后每 10 天长大一级。地块面板写着“丧尸会自己繁殖”，附近三格内就有巢；地盘推到两格以内，或者有人在巢旁边干活，就能找到它（地图上暗红色、会鼓动的肉堆）。找到后离地盘两格以内就能派人直接去端，最好几个人同一天一起上；端掉的巢里常有前人留下的装备。</li>
        <li>被丧尸弄伤有时是咬伤，住户卡上会写“被咬 · 还剩几晚”。到期前用急救包、或者收复医院就能治好；懂护理的人留守据点能多拖一晚。拖到最后，就得决定送他走，还是绑起来赌一把。急救包除了开局那几个，搜刮医院、超市、住宅时偶尔也能翻到。</li>
        <li>住户之间有旧识和过节。有人心里有牵挂（粉色小旗）：救家人、拿东西、收回老家、不准拆某栋楼。达成了他会更卖力，放着不管会出事。</li>
        <li>装备：每人能带一件，在“装备”分页里分配。撬棍在五金行、对讲机在派出所、急救包在医院和超市，住宅里有脚踏车，废墟里有安全帽（地图上的黄点）；消防斧和安全帽也能花材料在据点打造。受伤时身上的东西可能掉在原地。</li>
        <li>清晨偶尔会有事找上门：街区里的另一伙人（白旗）、收音机里的求救信号（蓝旗）、发烧的住户、烧起来的楼。有些事会接着发展好几天。</li>
      </ol>
      <div class="row"><button class="btn primary" id="d-ok">开始</button></div>`, () => { $('d-ok').onclick = closeDlg; });
    if (mode === 'new') return dlg(`<h2>开新的一局？</h2><p>现在的进度会被覆盖。想留着的话，先去存档里复制一份。</p>
      <div class="row"><button class="btn primary" id="d-yes">开新的一局</button><button class="btn" id="d-no">取消</button></div>`,
      () => { $('d-yes').onclick = () => { newGame(); mode = 'help'; renderOverlay(); }; $('d-no').onclick = closeDlg; });
    if (mode === 'save') return dlg(`<h2>存档</h2>
      <p class="dim">进度会自动存在这个浏览器里。换设备或想备份时，复制这段文本，之后粘贴回来。</p>
      <textarea id="exp" readonly aria-label="当前存档">${Sim.serialize(S).replace(/</g, '&lt;')}</textarea>
      <div class="row"><button class="btn" id="d-copy">复制存档</button><span class="dim" id="d-msg"></span></div>
      <textarea id="imp" aria-label="粘贴存档" placeholder="在这里粘贴存档文本"></textarea>
      <div class="row"><button class="btn" id="d-load">载入</button><input type="file" id="d-file" accept=".json,.txt,application/json,text/plain"><button class="btn primary" id="d-close">关闭</button></div>`, () => {
        $('d-copy').onclick = async () => { const ta = $('exp'); try { await navigator.clipboard.writeText(ta.value); $('d-msg').textContent = '已复制'; } catch (e) { ta.focus(); ta.select(); $('d-msg').textContent = '已选中，按 Ctrl/⌘+C'; } };
        const tryLoad = txt => { try { const ns = Sim.deserialize(txt.trim()); mode = null; selSurv = null; overSeen = false; commit(ns); } catch (e) { $('d-msg').textContent = '载入失败：' + e.message; } };
        $('d-load').onclick = () => tryLoad($('imp').value);
        $('d-file').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => tryLoad(String(r.result)); r.readAsText(f); };
        $('d-close').onclick = closeDlg;
      });
    if (mode === 'rules') return dlg(`<h2>楼规</h2>
      <div class="rules scroll" style="max-height:360px">${S.city ? `<div><span class="ln ln-城况 chip">城况</span> <span class="c-amber">${Sim.CITIES[S.city].name}</span> <span class="dim">${Sim.CITIES[S.city].desc}</span></div>` : ''}${S.origin ? `<div><span class="ln ln-出身 chip">出身</span> <span class="c-amber">${Sim.ORIGINS[S.origin].name}</span> <span class="dim">${Sim.ORIGINS[S.origin].desc}</span></div>` : ''}${S.rules.length ? S.rules.map(k => { const r = Sim.RULES[k]; return `<div><span class="ln ln-${r.line} chip">${r.line}</span> <span class="c-amber">${r.name}</span> <span class="dim">${r.desc}</span></div>`; }).join('') : `<p class="dim">还没有楼规。每次撑过尸潮（每 ${Sim.surgeEvery(S)} 天一次），第二天早上会从三张里选一张。</p>`}</div>
      <div class="row"><button class="btn primary" id="d-ok">关闭</button></div>`, () => { $('d-ok').onclick = closeDlg; });
    if (S.event && Sim.eventView(S).draft) {
      const ev = Sim.eventView(S);
      return dlg(`<h2>${ic('sun')}${ev.title || '定一条楼规'}</h2><p class="dim">${ev.text}</p>
        <div class="cards">${ev.choices.map((c, i) => `<button class="btn card" data-c="${i}"><span class="ln ln-${c.line}">${c.line}</span><b>${c.label}</b><span class="d">${c.note}</span></button>`).join('')}</div>`,
        () => $('dlg').querySelectorAll('[data-c]').forEach(b => b.onclick = () => commit(Sim.resolveEvent(S, +b.dataset.c))));
    }
    if (S.event) {
      const ev = Sim.eventView(S);
      return dlg(`<h2>${ic('sun')}第 ${S.day} 天 · 清晨</h2><p>${ev.text}</p><div class="choices">${ev.choices.map((c, i) =>
        `<button class="btn" data-c="${i}" ${c.ok ? '' : 'disabled'}>${c.label}${c.note ? `<small>${c.note}${c.ok ? '' : '（条件不够）'}</small>` : ''}</button>`).join('')}</div>`,
        () => $('dlg').querySelectorAll('[data-c]').forEach(b => b.onclick = () => commit(Sim.resolveEvent(S, +b.dataset.c))));
    }
    if (S.over && !overSeen) {
      const o = S.over;
      return dlg(`<h2>${o.win ? `${ic('heli')}撑到了` : `${ic('skull')}失守`}</h2><p>${o.reason}</p>
        <div class="row"><span class="big">${o.score}</span><span class="dim">分 · 活下来 ${S.surv.length} 人 · 收复 ${Sim.owned(S).length} 块 · 失去 ${S.stats.lost} 人 · 清掉 ${S.stats.killed} 只</span></div>
        <div class="row"><button class="btn primary" id="d-again">再来一局</button><button class="btn" id="d-look">看看地图</button></div>`,
        () => { $('d-again').onclick = () => { newGame(); mode = 'help'; renderOverlay(); }; $('d-look').onclick = () => { overSeen = true; closeDlg(); }; });
    }
    $('ov').hidden = true;
  }

  function newGame() { selSurv = null; selTile = { x: 1, y: 6 }; mode = null; tab = 'tile'; overSeen = false; report = null; commit(Sim.newGame()); }

  // ---------- 缩放 ----------
  let rotateSkipped = false;
  function fit() {
    const f = $('fit'), cs = getComputedStyle(f);
    const aw = f.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = f.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    let sc = Math.min(aw / 964, ah / 544);
    if (sc >= 2) sc = Math.floor(sc);
    $('stage').style.transform = `translate(${2 * sc}px,${2 * sc}px) scale(${sc})`;
    $('scaler').style.width = 964 * sc + 'px'; $('scaler').style.height = 544 * sc + 'px';
    $('rotate').hidden = rotateSkipped || !(innerHeight > innerWidth && innerWidth < 600);
  }
  addEventListener('resize', fit);
  $('rotate-skip').onclick = () => { rotateSkipped = true; fit(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ['help', 'save', 'new', 'rules'].includes(mode)) closeDlg(); });

  S = load() || Sim.newGame();
  if (S.day === 1 && !S.log.some(l => l.d > 1)) mode = 'help';
  fit(); render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); render(); });
})();
</script>
